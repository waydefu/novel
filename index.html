<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NEXCORE :: LINK START</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;600;700&display=swap"
rel="stylesheet"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>

:root{

    --gold:#d4af37;
    --gold-soft:rgba(212,175,55,.15);
    --gold-glow:rgba(212,175,55,.45);

    --bg:#020202;

    --font-main:'Orbitron',sans-serif;
    --font-sub:'Rajdhani',sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

    background:black;

    font-family:var(--font-main);
}

/* =========================================
   WEBGL
========================================= */

#webgl-container{

    position:fixed;
    inset:0;

    z-index:1;
}

/* =========================================
   GLOBAL FX
========================================= */

.scanlines{

    position:fixed;
    inset:0;

    z-index:8;

    pointer-events:none;

    opacity:.08;

    background:
    repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,.15) 3px
    );
}

.vignette{

    position:fixed;
    inset:0;

    z-index:9;

    pointer-events:none;

    background:
    radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,.55) 100%
    );
}

/* =========================================
   HUD
========================================= */

.hud{

    position:fixed;
    inset:0;

    z-index:10;

    pointer-events:none;

    display:grid;

    grid-template-columns:
    minmax(240px,18vw)
    1fr
    minmax(240px,18vw);

    grid-template-rows:
    90px
    1fr
    130px;

    padding:clamp(14px,2vw,28px);

    gap:16px;
}

/* =========================================
   PANEL
========================================= */

.panel{

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        rgba(15,15,15,.5),
        rgba(0,0,0,.78)
    );

    border:
    1px solid rgba(212,175,55,.12);

    backdrop-filter:blur(10px);

    box-shadow:

    inset 0 0 40px rgba(212,175,55,.02),

    0 0 20px rgba(212,175,55,.05);

    padding:14px;

    opacity:0;
}

.panel::before{

    content:'';

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.06),
        transparent
    );

    animation:panelSweep 6s linear infinite;
}

@keyframes panelSweep{

    100%{
        left:140%;
    }
}

.panel-header{

    display:flex;
    justify-content:space-between;

    margin-bottom:12px;

    font-size:.7rem;

    letter-spacing:.35em;

    color:var(--gold);

    text-shadow:
    0 0 8px var(--gold-glow);
}

.data-row{

    display:flex;
    justify-content:space-between;

    margin-bottom:8px;

    font-family:var(--font-sub);

    font-size:.9rem;

    color:rgba(255,255,255,.7);
}

.data-val{

    color:var(--gold);

    text-shadow:
    0 0 8px rgba(212,175,55,.45);
}

/* =========================================
   HEADER
========================================= */

.header-left{

    grid-column:1;
    grid-row:1;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.system-status{

    color:var(--gold);

    font-size:1.2rem;

    letter-spacing:.4em;

    animation:uiPulse 4s ease-in-out infinite;

    text-shadow:

    0 0 8px rgba(212,175,55,.5),

    0 0 20px rgba(212,175,55,.25);
}

@keyframes uiPulse{

    0%,100%{

        opacity:.65;
        filter:brightness(1);
    }

    50%{

        opacity:1;
        filter:brightness(1.25);
    }
}

.header-center{

    grid-column:2;
    grid-row:1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.main-title{

    position:relative;

    font-size:
    clamp(2rem,5vw,5rem);

    font-weight:900;

    letter-spacing:
    clamp(.4rem,1vw,1rem);

    color:var(--gold);

    mix-blend-mode:screen;

    text-shadow:

    0 0 8px rgba(212,175,55,.6),

    0 0 25px rgba(212,175,55,.35),

    0 0 50px rgba(255,120,0,.15);

    animation:uiPulse 5s ease-in-out infinite;
}

.main-title::after{

    content:'';

    position:absolute;

    bottom:-14px;
    left:0;

    width:100%;
    height:1px;

    background:
    linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
    );
}

/* =========================================
   COLUMNS
========================================= */

.left-col{

    grid-column:1;
    grid-row:2;

    display:flex;
    flex-direction:column;

    gap:14px;
}

.right-col{

    grid-column:3;
    grid-row:2;

    display:flex;
    flex-direction:column;

    gap:14px;
}

/* =========================================
   BUTTON
========================================= */

.footer{

    grid-column:2;
    grid-row:3;

    display:flex;
    justify-content:center;
    align-items:end;
}

.link-btn{

    pointer-events:auto;

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        rgba(212,175,55,.12),
        rgba(0,0,0,.85)
    );

    border:
    1px solid rgba(212,175,55,.28);

    color:var(--gold);

    padding:
    16px 60px;

    font-size:1rem;

    letter-spacing:.5em;

    font-family:var(--font-main);

    cursor:pointer;

    transition:.4s;

    text-shadow:
    0 0 10px rgba(212,175,55,.5);
}

.link-btn::before{

    content:'';

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.2),
        transparent
    );

    transition:.7s;
}

.link-btn:hover::before{
    left:120%;
}

.link-btn:hover{

    transform:translateY(-2px);

    box-shadow:

    0 0 25px rgba(212,175,55,.25),

    0 0 60px rgba(255,120,0,.1);
}

/* =========================================
   STREAM TEXT
========================================= */

.stream-layer{

    position:fixed;
    inset:0;

    z-index:6;

    overflow:hidden;

    pointer-events:none;
}

.stream{

    position:absolute;

    color:rgba(212,175,55,.7);

    font-family:var(--font-sub);

    letter-spacing:.2em;

    white-space:nowrap;

    text-shadow:
    0 0 10px rgba(212,175,55,.5);

    opacity:0;
}

/* =========================================
   LOGIN TEXT
========================================= */

.login-overlay{

    position:fixed;
    inset:0;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;

    opacity:0;
}

.login-text{

    color:white;

    font-size:
    clamp(1.2rem,3vw,3rem);

    letter-spacing:.8em;

    text-shadow:

    0 0 10px white,

    0 0 30px rgba(255,255,255,.4);
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:960px){

    .hud{

        grid-template-columns:1fr;

        grid-template-rows:auto;

        overflow-y:auto;
    }

    .header-left,
    .header-center,
    .left-col,
    .right-col,
    .footer{

        grid-column:1;
    }

    .header-left{grid-row:1;}
    .header-center{grid-row:2;}
    .left-col{grid-row:3;}
    .right-col{grid-row:4;}
    .footer{grid-row:5;}

    .main-title{

        text-align:center;
        line-height:1.2;
    }
}

</style>

<script type="importmap">
{
    "imports": {
        "three":"https://unpkg.com/three@0.150.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.150.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="webgl-container"></div>

<div class="stream-layer"></div>

<div class="scanlines"></div>

<div class="vignette"></div>

<div class="login-overlay">

    <div class="login-text">
        LINK START
    </div>

</div>

<div class="hud">

    <div class="panel header-left">

        <div class="system-status">
            ACTIVE
        </div>

        <div
        style="
        color:rgba(255,255,255,.65);
        font-size:.8rem;
        letter-spacing:.25em;
        ">
            ARCANE<br>
            SYSTEM
        </div>

    </div>

    <div class="header-center">

        <div class="main-title">
            NEXCORE
        </div>

    </div>

    <div class="left-col">

        <div class="panel">

            <div class="panel-header">

                <span>TIME_SYNC</span>

                <span>LOCAL</span>

            </div>

            <div class="data-row">
                <span>DATE</span>
                <span class="data-val" id="date"></span>
            </div>

            <div class="data-row">
                <span>TIME</span>
                <span class="data-val" id="time"></span>
            </div>

            <div class="data-row">
                <span>UTC</span>
                <span class="data-val" id="utc"></span>
            </div>

        </div>

    </div>

    <div class="right-col">

        <div class="panel">

            <div class="panel-header">

                <span>DISPLAY_SYNC</span>

            </div>

            <div class="data-row">
                <span>WIDTH</span>
                <span class="data-val" id="width"></span>
            </div>

            <div class="data-row">
                <span>HEIGHT</span>
                <span class="data-val" id="height"></span>
            </div>

            <div class="data-row">
                <span>PIXEL_RATIO</span>
                <span class="data-val" id="ratio"></span>
            </div>

        </div>

    </div>

    <div class="footer">

        <button
        class="link-btn"
        id="link-btn">

            LINK START

        </button>

    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================
   SCENE
========================================= */

const scene =
new THREE.Scene();

scene.fog =
new THREE.FogExp2(
    0x000000,
    0.012
);

const camera =
new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.1,

    2000
);

camera.position.z = 36;

const renderer =
new THREE.WebGLRenderer({

    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
.getElementById('webgl-container')
.appendChild(renderer.domElement);

/* =========================================
   POST FX
========================================= */

const composer =
new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom =
new UnrealBloomPass(

    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),

    .65,
    .4,
    .2
);

composer.addPass(bloom);

/* =========================================
   CORE
========================================= */

const uniforms = {

    uTime:{value:0}
};

const coreMat =
new THREE.ShaderMaterial({

    transparent:true,

    wireframe:true,

    uniforms,

    vertexShader:`

    uniform float uTime;

    varying vec3 vNormal;

    void main(){

        vNormal = normal;

        vec3 pos = position;

        float wave =

        sin(pos.x * 2.5 + uTime)
        *
        cos(pos.y * 2.5 + uTime)
        *
        0.15;

        pos += normal * wave;

        gl_Position =

        projectionMatrix *
        modelViewMatrix *
        vec4(pos,1.0);
    }
    `,

    fragmentShader:`

    varying vec3 vNormal;

    void main(){

        float fresnel =

        pow(
            1.0 -
            dot(vNormal,vec3(0,0,1.0)),
            2.0
        );

        vec3 color =

        vec3(.83,.68,.22)
        *
        fresnel
        *
        1.2;

        gl_FragColor =
        vec4(color,.55);
    }
    `
});

const core =
new THREE.Mesh(

    new THREE.TorusKnotGeometry(
        4,
        .8,
        260,
        24
    ),

    coreMat
);

scene.add(core);

/* =========================================
   RINGS
========================================= */

function createRing(radius,color){

    const geo =
    new THREE.RingGeometry(
        radius,
        radius + .03,
        120
    );

    const mat =
    new THREE.MeshBasicMaterial({

        color,
        transparent:true,
        opacity:.15,
        side:THREE.DoubleSide
    });

    const mesh =
    new THREE.Mesh(geo,mat);

    mesh.rotation.x =
    Math.PI/2;

    scene.add(mesh);

    return mesh;
}

const ring1 =
createRing(8,0xd4af37);

const ring2 =
createRing(12,0xd4af37);

const ring3 =
createRing(16,0xd4af37);

/* =========================================
   DATA STREAM TUNNEL
========================================= */

const streamGroup =
new THREE.Group();

scene.add(streamGroup);

const streamTexts = [];

const labels = [

    'SYS_CORE',
    'NEURAL_LINK',
    'AUTH',
    'SYNC',
    'A-204',
    'NEXCORE',
    'INIT',
    'GATEWAY',
    '01X',
    'SEQUENCE'
];

for(let i=0;i<220;i++){

    const canvas =
    document.createElement('canvas');

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
    canvas.getContext('2d');

    ctx.fillStyle =
    'rgba(212,175,55,.9)';

    ctx.font =
    'bold 42px Orbitron';

    ctx.fillText(

        labels[
            Math.floor(
                Math.random()*labels.length
            )
        ],

        30,
        70
    );

    const texture =
    new THREE.CanvasTexture(canvas);

    const material =
    new THREE.SpriteMaterial({

        map:texture,

        transparent:true,

        opacity:0
    });

    const sprite =
    new THREE.Sprite(material);

    sprite.position.x =
    (Math.random()-.5)*30;

    sprite.position.y =
    (Math.random()-.5)*20;

    sprite.position.z =
    -Math.random()*1000;

    sprite.scale.set(6,1.5,1);

    streamGroup.add(sprite);

    streamTexts.push(sprite);
}

/* =========================================
   DATA
========================================= */

function syncData(){

    const now = new Date();

    document.getElementById('date')
    .innerText =
    now.toLocaleDateString();

    document.getElementById('time')
    .innerText =
    now.toLocaleTimeString();

    document.getElementById('utc')
    .innerText =
    now.toUTCString().slice(17,25);

    document.getElementById('width')
    .innerText =
    window.innerWidth;

    document.getElementById('height')
    .innerText =
    window.innerHeight;

    document.getElementById('ratio')
    .innerText =
    window.devicePixelRatio.toFixed(2);
}

syncData();

setInterval(syncData,1000);

/* =========================================
   UI INTRO
========================================= */

gsap.to(

    '.panel',

    {

        opacity:1,

        y:0,

        from:{y:25},

        stagger:.08,

        duration:1.5,

        ease:'power4.out'
    }
);

/* =========================================
   ANIMATION
========================================= */

const clock =
new THREE.Clock();

let tunnelActive = false;

function animate(){

    requestAnimationFrame(animate);

    const t =
    clock.getElapsedTime();

    uniforms.uTime.value = t;

    core.rotation.x += .0015;
    core.rotation.y += .0025;

    ring1.rotation.z += .0015;
    ring2.rotation.z -= .001;
    ring3.rotation.z += .0005;

    if(tunnelActive){

        streamTexts.forEach(s=>{

            s.material.opacity = .8;

            s.position.z += 10;

            if(s.position.z > 40){

                s.position.z = -1000;
            }
        });
    }

    composer.render();
}

animate();

/* =========================================
   LINK START
========================================= */

const btn =
document.getElementById('link-btn');

btn.addEventListener('click',()=>{

    tunnelActive = true;

    gsap.to(

        '.login-overlay',

        {
            opacity:1,
            duration:.4
        }
    );

    gsap.to(

        '.hud',

        {
            opacity:.15,
            duration:1.2
        }
    );

    gsap.to(

        bloom,

        {
            strength:1.4,
            duration:.8
        }
    );

    gsap.to(

        camera.position,

        {

            z:6,

            duration:4,

            ease:'power4.in'
        }
    );

    gsap.to(

        core.rotation,

        {

            y:12,

            duration:4
        }
    );

    gsap.to(

        '.login-overlay',

        {

            opacity:0,

            delay:2,

            duration:1.5
        }
    );

    gsap.to(

        '.link-btn',

        {
            opacity:0,
            duration:.5
        }
    );
});

/* =========================================
   RESIZE
========================================= */

window.addEventListener(

    'resize',

    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
