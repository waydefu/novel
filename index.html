<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NEXCORE GATE</title>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
rel="stylesheet"
/>

<style>

/* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    background:#000;

    font-family:'Orbitron',sans-serif;
}

/* =========================
WEBGL
========================= */

#webgl-container{

    position:fixed;
    inset:0;

    z-index:1;
}

/* =========================
FX
========================= */

.scanlines{

    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
    repeating-linear-gradient(

        to bottom,

        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,

        transparent 2px,
        transparent 4px
    );

    opacity:.14;
}

.vignette{

    position:fixed;
    inset:0;

    z-index:21;

    pointer-events:none;

    background:
    radial-gradient(

        circle,

        transparent 35%,
        rgba(0,0,0,.7) 100%
    );
}

/* =========================
LOGIN
========================= */

.login-overlay{

    position:fixed;
    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    pointer-events:none;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.08),
        rgba(0,0,0,.92)
    );
}

.login-text{

    font-size:
    clamp(2rem,7vw,7rem);

    color:#d4af37;

    letter-spacing:.6em;

    font-weight:900;

    text-shadow:

    0 0 10px rgba(212,175,55,.8),

    0 0 30px rgba(212,175,55,.4),

    0 0 100px rgba(255,120,0,.2);

    animation:
    loginPulse 1.5s ease-in-out infinite;
}

@keyframes loginPulse{

    0%,100%{

        transform:scale(1);
        opacity:.7;
    }

    50%{

        transform:scale(1.05);
        opacity:1;
    }
}

/* =========================
HUD
========================= */

.hud{

    position:fixed;
    inset:0;

    z-index:10;

    pointer-events:none;

    display:grid;

    grid-template-columns:
    280px
    1fr
    280px;

    grid-template-rows:
    120px
    1fr
    160px;

    gap:18px;

    padding:24px;
}

.top-center{

    grid-column:2;
    grid-row:1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.left-col{

    grid-column:1;
    grid-row:2;

    display:flex;
    flex-direction:column;

    gap:16px;
}

.right-col{

    grid-column:3;
    grid-row:2;

    display:flex;
    flex-direction:column;

    gap:16px;
}

.bottom-center{

    grid-column:2;
    grid-row:3;

    display:flex;
    justify-content:center;
    align-items:center;

    transform:translateY(-40px);
}

/* =========================
TITLE
========================= */

.main-title{

    font-size:
    clamp(2rem,5vw,5rem);

    font-weight:900;

    letter-spacing:
    clamp(.5rem,1vw,1rem);

    color:#d4af37;

    text-shadow:

    0 0 8px rgba(212,175,55,.55),

    0 0 30px rgba(212,175,55,.25),

    0 0 60px rgba(255,120,0,.1);

    animation:titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse{

    0%,100%{

        opacity:.7;
        transform:scale(1);
    }

    50%{

        opacity:1;
        transform:scale(1.02);
    }
}

/* =========================
PANELS
========================= */

.panel{

    background:

    linear-gradient(
        to bottom,
        rgba(20,20,20,.5),
        rgba(0,0,0,.82)
    );

    border:
    1px solid rgba(212,175,55,.1);

    backdrop-filter:blur(10px);

    box-shadow:

    inset 0 0 40px rgba(212,175,55,.03),

    0 0 15px rgba(212,175,55,.05);

    padding:16px;

    position:relative;

    overflow:hidden;
}

.panel::before{

    content:'';

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.06),
        transparent
    );

    animation:panelSweep 6s linear infinite;
}

@keyframes panelSweep{

    100%{
        left:140%;
    }
}

.panel-header{

    display:flex;
    justify-content:space-between;

    margin-bottom:14px;

    color:#d4af37;

    font-size:.75rem;

    letter-spacing:.25em;
}

.data-row{

    display:flex;
    justify-content:space-between;

    margin-bottom:10px;

    color:rgba(255,255,255,.7);

    font-size:.75rem;

    letter-spacing:.15em;
}

.data-val{

    color:#d4af37;
}

/* =========================
BUTTON
========================= */

.link-btn{

    pointer-events:auto;

    padding:16px 72px;

    background:
    linear-gradient(
        to bottom,
        rgba(212,175,55,.12),
        rgba(0,0,0,.88)
    );

    border:
    1px solid rgba(212,175,55,.28);

    color:#d4af37;

    font-family:'Orbitron',sans-serif;

    letter-spacing:.45em;

    cursor:pointer;

    transition:.4s;
}

.link-btn:hover{

    box-shadow:

    0 0 25px rgba(212,175,55,.25),

    0 0 60px rgba(255,120,0,.1);
}

/* =========================
MOBILE
========================= */

@media(max-width:960px){

    .hud{

        display:flex;
        flex-direction:column;

        justify-content:center;
        align-items:center;

        gap:18px;

        padding:20px;
    }

    .left-col,
    .right-col{

        width:100%;
        max-width:320px;
    }

    .main-title{

        font-size:2.5rem;

        text-align:center;

        margin-bottom:10px;
    }

    .bottom-center{

        transform:none;
    }

    .link-btn{

        width:100%;
        max-width:320px;
    }
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="webgl-container"></div>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="login-overlay">

    <div class="login-text">
        LINK START
    </div>

</div>

<div class="hud">

    <div class="top-center">

        <div class="main-title">
            NEXCORE
        </div>

    </div>

    <!-- LEFT -->

    <div class="left-col">

        <div class="panel">

            <div class="panel-header">
                <span>IDENTITY</span>
            </div>

            <div class="data-row">
                <span>USER</span>
                <span class="data-val">NEX-01</span>
            </div>

            <div class="data-row">
                <span>ACCESS</span>
                <span class="data-val">AUTHORIZED</span>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">
                <span>AUTH STATUS</span>
            </div>

            <div class="data-row">
                <span>STATE</span>
                <span class="data-val">STANDBY</span>
            </div>

            <div class="data-row">
                <span>VERIFY</span>
                <span class="data-val">PENDING</span>
            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right-col">

        <div class="panel">

            <div class="panel-header">
                <span>GATE STATUS</span>
            </div>

            <div class="data-row">
                <span>SYNC</span>
                <span class="data-val" id="sync-val">12%</span>
            </div>

            <div class="data-row">
                <span>SIGNAL</span>
                <span class="data-val">ONLINE</span>
            </div>

        </div>

        <div class="panel">

            <div class="panel-header">
                <span>NETWORK</span>
            </div>

            <div class="data-row">
                <span>LATENCY</span>
                <span class="data-val">12ms</span>
            </div>

            <div class="data-row">
                <span>GATE</span>
                <span class="data-val">LOCKED</span>
            </div>

        </div>

    </div>

    <!-- BUTTON -->

    <div class="bottom-center">

        <button
        id="link-btn"
        class="link-btn">

            LINK START

        </button>

    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================
SCENE
========================= */

const scene =
new THREE.Scene();

scene.fog =
new THREE.FogExp2(
    0x000000,
    0.009
);

const camera =
new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.1,

    3000
);

camera.position.z = 55;

/* =========================
RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({

    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
.getElementById('webgl-container')
.appendChild(renderer.domElement);

/* =========================
POST FX
========================= */

const composer =
new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom =
new UnrealBloomPass(

    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),

    .55,
    .45,
    .2
);

composer.addPass(bloom);

/* =========================
LOCK
========================= */

const lockGroup =
new THREE.Group();

const lockCircle =
new THREE.Mesh(

    new THREE.TorusGeometry(
        3,
        .35,
        16,
        120
    ),

    new THREE.MeshBasicMaterial({

        color:0xd4af37,

        wireframe:true
    })
);

lockCircle.position.y = 2;

const lockBody =
new THREE.Mesh(

    new THREE.BoxGeometry(
        4,
        5,
        .4
    ),

    new THREE.MeshBasicMaterial({

        color:0xd4af37,

        wireframe:true
    })
);

lockBody.position.y = -1.5;

const keyHole =
new THREE.Mesh(

    new THREE.CylinderGeometry(
        .25,
        .25,
        1.8,
        16
    ),

    new THREE.MeshBasicMaterial({

        color:0xd4af37,

        wireframe:true
    })
);

keyHole.position.y = -1.5;

lockGroup.add(lockCircle);
lockGroup.add(lockBody);
lockGroup.add(keyHole);

scene.add(lockGroup);

/* =========================
KEY
========================= */

const keyGroup =
new THREE.Group();

const keyHead =
new THREE.Mesh(

    new THREE.TorusGeometry(
        1.2,
        .22,
        16,
        60
    ),

    new THREE.MeshBasicMaterial({

        color:0x66ccff,

        wireframe:true
    })
);

keyHead.position.x = -2;

const keyStem =
new THREE.Mesh(

    new THREE.BoxGeometry(
        5,
        .35,
        .35
    ),

    new THREE.MeshBasicMaterial({

        color:0x66ccff,

        wireframe:true
    })
);

const tooth1 =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .5,
        1,
        .35
    ),

    new THREE.MeshBasicMaterial({

        color:0x66ccff,

        wireframe:true
    })
);

tooth1.position.set(1.5,-.6,0);

const tooth2 =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .5,
        .7,
        .35
    ),

    new THREE.MeshBasicMaterial({

        color:0x66ccff,

        wireframe:true
    })
);

tooth2.position.set(2.2,-.45,0);

keyGroup.add(keyHead);
keyGroup.add(keyStem);
keyGroup.add(tooth1);
keyGroup.add(tooth2);

keyGroup.visible = false;

scene.add(keyGroup);

/* =========================
RINGS
========================= */

function createRing(radius,color){

    const geo =
    new THREE.RingGeometry(
        radius,
        radius + .03,
        120
    );

    const mat =
    new THREE.MeshBasicMaterial({

        color,

        transparent:true,

        opacity:.12,

        side:THREE.DoubleSide
    });

    const ring =
    new THREE.Mesh(geo,mat);

    ring.rotation.x =
    Math.PI/2;

    scene.add(ring);

    return ring;
}

const ring1 =
createRing(10,0xd4af37);

const ring2 =
createRing(15,0x66ccff);

const ring3 =
createRing(20,0xff6b00);

/* =========================
STREAM
========================= */

const streamGroup =
new THREE.Group();

scene.add(streamGroup);

const streamObjects = [];

const colors = [

    0xd4af37,
    0x66ccff,
    0xff6b00
];

for(let i=0;i<1500;i++){

    const geo =
    new THREE.BoxGeometry(

        .03,
        .03,

        2 + Math.random()*8
    );

    const mat =
    new THREE.MeshBasicMaterial({

        color:
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ],

        transparent:true,

        opacity:
        .15 + Math.random()*.45
    });

    const mesh =
    new THREE.Mesh(geo,mat);

    const angle =
    Math.random() * Math.PI * 2;

    const radius =
    2 + Math.random()*18;

    mesh.userData = {

        velocity:
        8 + Math.random()*25,

        angle,

        radius
    };

    mesh.position.x =
    Math.cos(angle) * radius;

    mesh.position.y =
    Math.sin(angle) * radius;

    mesh.position.z =
    -Math.random()*2500;

    mesh.lookAt(0,0,mesh.position.z+10);

    streamGroup.add(mesh);

    streamObjects.push(mesh);
}

/* =========================
HUD
========================= */

let sync = 12;

setInterval(()=>{

    sync += Math.random()*3;

    if(sync > 99)
    sync = 12;

    document
    .getElementById('sync-val')
    .innerText =
    Math.floor(sync) + '%';

},800);

/* =========================
INTRO
========================= */

gsap.from(

    '.panel',

    {

        opacity:0,

        y:25,

        stagger:.08,

        duration:1.4,

        ease:'power4.out'
    }
);

/* =========================
LOCK / KEY SWITCH
========================= */

let showingKey = false;

setInterval(()=>{

    if(linkStarted) return;

    showingKey = !showingKey;

    const current =
    showingKey
    ? lockGroup
    : keyGroup;

    const next =
    showingKey
    ? keyGroup
    : lockGroup;

    gsap.to(current.scale,{

        x:0,
        y:0,
        z:0,

        duration:.5,

        onComplete:()=>{

            current.visible = false;

            next.visible = true;

            next.scale.set(0,0,0);

            gsap.to(next.scale,{

                x:1,
                y:1,
                z:1,

                duration:.6
            });
        }
    });

},4000);

/* =========================
ANIMATION
========================= */

const clock =
new THREE.Clock();

let animationEnded = false;

let linkStarted = false;

function animate(){

    if(animationEnded) return;

    requestAnimationFrame(animate);

    const t =
    clock.getElapsedTime();

    lockGroup.rotation.y += .01;
    keyGroup.rotation.y += .01;

    ring1.rotation.z += .0015;
    ring2.rotation.z -= .001;
    ring3.rotation.z += .0006;

    if(linkStarted){

        streamObjects.forEach(obj=>{

            obj.position.z +=
            obj.userData.velocity;

            obj.position.x *= 1.012;
            obj.position.y *= 1.012;

            obj.scale.x *= 1.003;
            obj.scale.y *= 1.003;

            if(obj.position.z > 80){

                obj.position.z = -2500;

                obj.position.x =
                Math.cos(obj.userData.angle)
                *
                obj.userData.radius;

                obj.position.y =
                Math.sin(obj.userData.angle)
                *
                obj.userData.radius;

                obj.scale.set(1,1,1);
            }
        });
    }

    composer.render();
}

animate();

/* =========================
LINK START
========================= */

const btn =
document.getElementById('link-btn');

btn.addEventListener('click',()=>{

    linkStarted = true;

    gsap.to(

        '.login-overlay',

        {

            opacity:1,

            duration:.4
        }
    );

    gsap.to(

        '.panel,.main-title',

        {

            opacity:.08,

            duration:2.8
        }
    );

    gsap.to(

        bloom,

        {

            strength:.8,

            duration:1
        }
    );

    gsap.to(

        camera.position,

        {

            z:-160,

            duration:7,

            ease:'power4.in'
        }
    );

    gsap.to(

        '.login-overlay',

        {

            opacity:0,

            delay:2,

            duration:2
        }
    );

    gsap.to(

        '.hud',

        {

            opacity:0,

            delay:4,

            duration:2
        }
    );

    setTimeout(()=>{

        gsap.to(renderer.domElement,{

            scaleY:0,

            opacity:0,

            duration:.5,

            ease:'power2.in'
        });

    },7600);

    setTimeout(()=>{

        animationEnded = true;

        renderer.dispose();

        document.body.innerHTML = `

        <div style="
        position:fixed;
        inset:0;
        background:black;
        display:flex;
        align-items:center;
        justify-content:center;
        color:rgba(255,255,255,.18);
        font-family:Orbitron,sans-serif;
        letter-spacing:.45em;
        font-size:1rem;
        ">

            CONNECTION ESTABLISHED

        </div>
        `;

    },8500);
});

/* =========================
RESIZE
========================= */

window.addEventListener(

    'resize',

    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
