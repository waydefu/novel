<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>NEXCORE ARCANE SYSTEM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>

:root{

    --gold:#d4af37;
    --gold-soft:rgba(212,175,55,0.25);
    --gold-faint:rgba(212,175,55,0.06);

    --red:#ff2a2a;
    --red-dark:rgba(255,42,42,0.18);

    --ember:#ff6b00;

    --bg:#030303;

    --panel-bg:rgba(5,5,5,0.75);

    --text:#f5e6b8;

    --font:'Courier New',monospace;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:radial-gradient(circle at center,#120909 0%,#050505 50%,#000 100%);
    color:white;
    font-family:var(--font);
}

#webgl-container{
    position:fixed;
    inset:0;
    z-index:1;
}

/* =========================
   OVERLAY
========================= */

.hud-overlay{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;

    display:grid;

    grid-template-columns:300px 1fr 300px;
    grid-template-rows:90px 1fr 150px;

    gap:18px;

    padding:22px;
}

.hud-panel{

    opacity:0;

    background:
    linear-gradient(
        to bottom,
        rgba(40,25,10,0.25),
        rgba(0,0,0,0.82)
    );

    border:1px solid rgba(212,175,55,0.22);

    backdrop-filter:blur(12px);

    box-shadow:
    0 0 40px rgba(212,175,55,0.06),
    inset 0 0 25px rgba(255,120,0,0.03);

    padding:12px;
    overflow:hidden;
}

.panel-header{

    display:flex;
    justify-content:space-between;

    color:var(--gold);

    font-size:11px;
    letter-spacing:3px;

    margin-bottom:12px;

    border-bottom:1px solid rgba(212,175,55,0.15);

    padding-bottom:6px;
}

.data-row{

    display:flex;
    justify-content:space-between;

    font-size:10px;

    margin-bottom:5px;

    color:rgba(255,255,255,0.72);
}

.data-val{
    color:var(--gold);
}

/* =========================
   TOP
========================= */

.header-left{

    grid-column:1;
    grid-row:1;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.system-status{

    color:var(--gold);

    font-size:16px;

    letter-spacing:5px;

    text-shadow:
    0 0 10px rgba(212,175,55,0.5),
    0 0 25px rgba(255,120,0,0.25);
}

.header-center{

    grid-column:2;
    grid-row:1;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.main-title{

    font-size:32px;

    letter-spacing:12px;

    color:var(--gold);

    text-shadow:
    0 0 12px rgba(212,175,55,0.45),
    0 0 30px rgba(255,120,0,0.25);

    position:relative;
}

.main-title::after{

    content:'';

    position:absolute;

    left:0;
    bottom:-12px;

    width:100%;
    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
    );
}

/* =========================
   LEFT
========================= */

.left-col{

    grid-column:1;
    grid-row:2;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* =========================
   RIGHT
========================= */

.right-col{

    grid-column:3;
    grid-row:2 / span 2;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* =========================
   FOOTER
========================= */

.footer-center{

    grid-column:2;
    grid-row:3;

    display:flex;
    align-items:end;
    justify-content:center;

    padding-bottom:40px;
}

.btn-engage{

    pointer-events:auto;

    background:
    linear-gradient(
        to bottom,
        rgba(212,175,55,0.12),
        rgba(0,0,0,0.8)
    );

    color:var(--gold);

    border:1px solid rgba(212,175,55,0.35);

    padding:14px 70px;

    font-size:1rem;

    letter-spacing:8px;

    cursor:pointer;

    transition:0.4s ease;

    position:relative;

    overflow:hidden;
}

.btn-engage::before{

    content:'';

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.2),
        transparent
    );

    transition:0.6s;
}

.btn-engage:hover::before{
    left:100%;
}

.btn-engage:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(212,175,55,0.25),
    0 0 50px rgba(255,120,0,0.12);

    border-color:var(--gold);
}

/* =========================
   CHART
========================= */

.bar-chart{

    display:flex;
    align-items:end;

    gap:5px;

    height:120px;

    margin-top:10px;
}

.bar{

    width:14px;

    background:
    linear-gradient(
        to top,
        #ff2a2a,
        #d4af37
    );

    height:50%;

    box-shadow:
    0 0 15px rgba(212,175,55,0.3);

    transition:0.3s;
}

/* =========================
   BOOT SCREEN
========================= */

.boot-screen{

    position:fixed;
    inset:0;

    z-index:20;

    background:black;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:var(--gold);

    pointer-events:none;
}

.boot-title{

    font-size:40px;
    letter-spacing:14px;

    margin-bottom:20px;

    opacity:0;
}

.boot-sub{

    font-size:14px;
    letter-spacing:6px;

    opacity:0.7;
}

.scan-line{

    position:absolute;

    top:-10%;

    width:100%;
    height:20%;

    background:
    linear-gradient(
        to bottom,
        transparent,
        rgba(212,175,55,0.08),
        transparent
    );

    filter:blur(10px);
}

</style>

<script type="importmap">
{
    "imports": {
        "three":"https://unpkg.com/three@0.150.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.150.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="webgl-container"></div>

<div class="boot-screen">

    <div class="scan-line"></div>

    <div class="boot-title">
        NEXCORE SYSTEM
    </div>

    <div class="boot-sub">
        ARCANE SEAL INITIALIZATION
    </div>

</div>

<div class="hud-overlay">

    <div class="hud-panel header-left">

        <div class="system-status">
            ACTIVE
        </div>

        <div style="font-size:10px;">
            ARCANE<br>
            SYSTEM
        </div>

    </div>

    <div class="header-center">

        <div class="main-title">
            NEXCORE
        </div>

    </div>

    <div class="left-col">

        <div class="hud-panel">

            <div class="panel-header">
                <span>TIME_SYNC</span>
                <span>LOCAL</span>
            </div>

            <div class="data-row">
                <span>DATE</span>
                <span class="data-val" id="date"></span>
            </div>

            <div class="data-row">
                <span>TIME</span>
                <span class="data-val" id="time"></span>
            </div>

            <div class="data-row">
                <span>UTC</span>
                <span class="data-val" id="utc"></span>
            </div>

        </div>

        <div class="hud-panel">

            <div class="panel-header">
                <span>SYSTEM_ANALYSIS</span>
            </div>

            <div class="data-row">
                <span>PLATFORM</span>
                <span class="data-val" id="platform"></span>
            </div>

            <div class="data-row">
                <span>CORES</span>
                <span class="data-val" id="cores"></span>
            </div>

            <div class="data-row">
                <span>LANG</span>
                <span class="data-val" id="lang"></span>
            </div>

        </div>

    </div>

    <div class="footer-center">

        <button class="btn-engage" id="engage-btn">
            SYNCHRONIZE
        </button>

    </div>

    <div class="right-col">

        <div class="hud-panel">

            <div class="panel-header">
                <span>DISPLAY_SYNC</span>
            </div>

            <div class="data-row">
                <span>WIDTH</span>
                <span class="data-val" id="width"></span>
            </div>

            <div class="data-row">
                <span>HEIGHT</span>
                <span class="data-val" id="height"></span>
            </div>

            <div class="data-row">
                <span>PIXEL_RATIO</span>
                <span class="data-val" id="ratio"></span>
            </div>

        </div>

        <div class="hud-panel">

            <div class="panel-header">
                <span>CORE_LOAD</span>
            </div>

            <div class="bar-chart">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        </div>

    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';

import { SAOPass }
from 'three/addons/postprocessing/SAOPass.js';

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
    0x050505,
    0.018
);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 35;

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

document
.getElementById('webgl-container')
.appendChild(renderer.domElement);

/* =========================
   POST FX
========================= */

const composer =
new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom =
new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),
    1.5,
    0.4,
    0.15
);

composer.addPass(bloom);

const saoPass =
new SAOPass(
    scene,
    camera,
    false,
    true
);

saoPass.params.saoIntensity = 0.02;
saoPass.params.saoScale = 10;
saoPass.params.saoKernelRadius = 32;

composer.addPass(saoPass);

/* =========================
   CORE
========================= */

const uniforms = {

    uTime:{value:0},

    uColor:{
        value:new THREE.Color('#d4af37')
    }
};

const material =
new THREE.ShaderMaterial({

    uniforms,

    wireframe:true,

    transparent:true,

    vertexShader:`

    uniform float uTime;

    varying vec3 vNormal;

    void main(){

        vNormal = normal;

        vec3 pos = position;

        float distortion =
        sin(pos.x * 2.0 + uTime)
        *
        sin(pos.y * 2.0 + uTime)
        *
        0.3;

        pos += normal * distortion;

        gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(pos,1.0);
    }
    `,

    fragmentShader:`

    uniform vec3 uColor;

    varying vec3 vNormal;

    void main(){

        float intensity =
        pow(
            0.9 -
            dot(vNormal,vec3(0,0,1.0)),
            2.0
        );

        vec3 glow =
        uColor * intensity * 2.8;

        vec3 ember =
        vec3(1.0,0.25,0.0)
        *
        pow(intensity,3.0);

        gl_FragColor =
        vec4(glow + ember,0.85);
    }
    `
});

const geometry =
new THREE.TorusKnotGeometry(
    3,
    0.6,
    260,
    32
);

const core =
new THREE.Mesh(
    geometry,
    material
);

scene.add(core);

/* =========================
   MAGIC RINGS
========================= */

function createRuneRing(radius,color){

    const group =
    new THREE.Group();

    const geo =
    new THREE.RingGeometry(
        radius,
        radius + 0.06,
        128
    );

    const mat =
    new THREE.MeshBasicMaterial({

        color,

        side:THREE.DoubleSide,

        transparent:true,

        opacity:0.25
    });

    const ring =
    new THREE.Mesh(geo,mat);

    group.add(ring);

    for(let i=0;i<28;i++){

        const angle =
        (Math.PI*2/28)*i;

        const runeGeo =
        new THREE.BoxGeometry(
            0.12,
            0.45,
            0.05
        );

        const runeMat =
        new THREE.MeshBasicMaterial({
            color
        });

        const rune =
        new THREE.Mesh(
            runeGeo,
            runeMat
        );

        rune.position.x =
        Math.cos(angle)*radius;

        rune.position.y =
        Math.sin(angle)*radius;

        rune.rotation.z =
        angle;

        group.add(rune);
    }

    group.rotation.x =
    Math.PI/2;

    return group;
}

const rune1 =
createRuneRing(8,0xd4af37);

const rune2 =
createRuneRing(11,0xff2a2a);

const rune3 =
createRuneRing(14,0xff6b00);

scene.add(rune1,rune2,rune3);

/* =========================
   PARTICLES
========================= */

const particleGeo =
new THREE.BufferGeometry();

const count = 2500;

const pos =
new Float32Array(count*3);

for(let i=0;i<count*3;i++){

    pos[i] =
    (Math.random()-0.5)*160;
}

particleGeo.setAttribute(
    'position',
    new THREE.BufferAttribute(pos,3)
);

const particleMat =
new THREE.PointsMaterial({

    size:0.08,

    color:'#d4af37',

    transparent:true,

    opacity:0.8
});

const particles =
new THREE.Points(
    particleGeo,
    particleMat
);

scene.add(particles);

/* =========================
   DATA
========================= */

function syncData(){

    const now = new Date();

    document.getElementById('date')
    .innerText =
    now.toLocaleDateString();

    document.getElementById('time')
    .innerText =
    now.toLocaleTimeString();

    document.getElementById('utc')
    .innerText =
    now.toUTCString().slice(17,25);

    document.getElementById('platform')
    .innerText =
    navigator.platform;

    document.getElementById('cores')
    .innerText =
    navigator.hardwareConcurrency;

    document.getElementById('lang')
    .innerText =
    navigator.language;

    document.getElementById('width')
    .innerText =
    window.innerWidth;

    document.getElementById('height')
    .innerText =
    window.innerHeight;

    document.getElementById('ratio')
    .innerText =
    window.devicePixelRatio.toFixed(2);
}

syncData();

setInterval(syncData,1000);

/* =========================
   ANIMATE
========================= */

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const t =
    clock.getElapsedTime();

    uniforms.uTime.value =
    t * 1.5;

    core.rotation.x += 0.002;
    core.rotation.y += 0.004;

    rune1.rotation.z += 0.002;
    rune2.rotation.z -= 0.0012;
    rune3.rotation.z += 0.0007;

    const arr =
    particleGeo.attributes.position.array;

    for(let i=2;i<count*3;i+=3){

        arr[i] += 0.15;

        if(arr[i] > 40){

            arr[i] = -100;
        }
    }

    particleGeo.attributes
    .position.needsUpdate = true;

    document
    .querySelectorAll('.bar')
    .forEach(bar=>{

        if(Math.random()>0.8){

            bar.style.height =
            (20 + Math.random()*80)
            + '%';
        }
    });

    composer.render();
}

animate();

/* =========================
   BOOT ANIMATION
========================= */

gsap.to(
    '.boot-title',
    {
        opacity:1,
        duration:2
    }
);

gsap.to(
    '.scan-line',
    {
        top:'120%',
        duration:2,
        ease:'power2.inOut',
        repeat:-1
    }
);

gsap.to(
    '.boot-screen',
    {
        opacity:0,
        delay:3,
        duration:2,
        pointerEvents:'none'
    }
);

gsap.to(
    '.hud-panel',
    {
        opacity:1,
        y:0,
        from:{y:30},
        stagger:0.1,
        duration:1.6,
        delay:3.2,
        ease:'power4.out'
    }
);

/* =========================
   BUTTON
========================= */

document
.getElementById('engage-btn')
.addEventListener('click',()=>{

    gsap.fromTo(

        camera.position,

        {
            z:35
        },

        {
            z:22,
            duration:2,
            ease:'power3.inOut'
        }
    );

    gsap.to(
        core.scale,
        {
            x:1.4,
            y:1.4,
            z:1.4,
            duration:1.5,
            yoyo:true,
            repeat:1
        }
    );
});

/* =========================
   RESIZE
========================= */

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
