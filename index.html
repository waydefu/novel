<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcore HUD - SAO Link Start Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --cyan: #00f3ff;
            --dark-cyan: rgba(0, 243, 255, 0.2);
            --bg: #010409;
            --sao-green: #00ff66; /* SAO 確認成功的綠色 */
            --font: 'Courier New', Courier, monospace;
        }

        body { margin: 0; overflow: hidden; background-color: var(--bg); font-family: var(--font); color: #fff; user-select: none; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* -------------------------------------
           基礎 Tactical HUD (簡化版，專注於中央)
        -------------------------------------- */
        .hud-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .main-title { font-size: 32px; letter-spacing: 15px; font-weight: bold; text-shadow: 0 0 10px var(--cyan); margin-bottom: 300px; color: var(--cyan); }

        .btn-engage {
            pointer-events: auto; background: rgba(0, 5, 15, 0.6); backdrop-filter: blur(5px);
            color: var(--cyan); border: 2px solid var(--cyan); padding: 15px 60px; font-size: 1.5rem;
            letter-spacing: 10px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px var(--dark-cyan) inset, 0 0 15px var(--dark-cyan);
            transition: all 0.3s ease; position: relative;
        }
        .btn-engage:hover { background: var(--dark-cyan); transform: scale(1.05); }

        /* -------------------------------------
           SAO 登入五圈確認介面 (初始隱藏)
        -------------------------------------- */
        #sao-sequence {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; display: none; /* 預設隱藏 */
            width: 400px; height: 400px;
        }

        /* 5個同心圓 */
        .sao-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            border: 2px solid var(--sao-green); border-radius: 50%;
            box-shadow: 0 0 20px var(--sao-green), inset 0 0 20px var(--sao-green);
            opacity: 0;
        }
        #ring-1 { width: 100px; height: 100px; }
        #ring-2 { width: 160px; height: 160px; }
        #ring-3 { width: 220px; height: 220px; border-style: dashed; }
        #ring-4 { width: 280px; height: 280px; }
        #ring-5 { width: 340px; height: 340px; border: 4px double var(--sao-green); }

        /* 感官確認列表 */
        .sao-list {
            position: absolute; top: 50%; left: 120%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px;
        }
        .sao-item {
            font-size: 20px; letter-spacing: 5px; color: transparent;
            display: flex; justify-content: space-between; width: 200px;
            text-shadow: 0 0 10px transparent;
        }
        .sao-item span { color: transparent; font-weight: bold; }

        /* 中央 LINK START 文字 */
        .link-start-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; font-weight: bold; color: var(--sao-green);
            letter-spacing: 12px; text-shadow: 0 0 20px var(--sao-green);
            opacity: 0; white-space: nowrap;
        }

        /* 全白閃屏特效 */
        #white-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 999; opacity: 0; pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="webgl-container"></div>
    <div id="white-flash"></div>

    <!-- 基礎戰術 HUD -->
    <div class="hud-overlay" id="main-hud">
        <div class="main-title">SYSTEM STANDBY</div>
        <button class="btn-engage" id="login-btn">LINK START</button>
    </div>

    <!-- SAO 登入動畫 UI -->
    <div id="sao-sequence">
        <div class="sao-ring" id="ring-5"></div>
        <div class="sao-ring" id="ring-4"></div>
        <div class="sao-ring" id="ring-3"></div>
        <div class="sao-ring" id="ring-2"></div>
        <div class="sao-ring" id="ring-1"></div>
        <div class="link-start-text">FULL DIVE</div>
        
        <div class="sao-list">
            <div class="sao-item" id="sense-1">SIGHT <span>OK</span></div>
            <div class="sao-item" id="sense-2">HEARING <span>OK</span></div>
            <div class="sao-item" id="sense-3">TOUCH <span>OK</span></div>
            <div class="sao-item" id="sense-4">TASTE <span>OK</span></div>
            <div class="sao-item" id="sense-5">SMELL <span>OK</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 1. 基礎場景 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000511, 0.015);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        // --- 2. 後期處理 (Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.3, 0.1);
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. 核心 Shader (液態能量球) ---
        const coreUniforms = { uTime: { value: 0.0 }, uDistortion: { value: 0.8 }, uColor: { value: new THREE.Color('#00f3ff') } };
        const coreMaterial = new THREE.ShaderMaterial({
            uniforms: coreUniforms, wireframe: true, transparent: true,
            vertexShader: `
                uniform float uTime; uniform float uDistortion; varying vec3 vNormal;
                void main() {
                    vNormal = normal; vec3 pos = position;
                    float noise = sin(pos.x * 2.0 + uTime) * sin(pos.y * 2.0 + uTime) * sin(pos.z * 2.0 + uTime);
                    pos += normal * noise * uDistortion;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor; varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.7 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
                    gl_FragColor = vec4(uColor * (intensity * 3.0 + 0.5), 0.8);
                }
            `
        });
        const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(4, 16), coreMaterial);
        scene.add(coreMesh);

        // --- 4. 【新增】極速躍遷隧道 (Wireframe Tunnel) ---
        // 建立一個巨大的圓柱體，只顯示科技線框
        const tunnelGeo = new THREE.CylinderGeometry(20, 20, 200, 32, 32, true);
        const tunnelMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0 }); // 初始不可見
        const tunnelMesh = new THREE.Mesh(tunnelGeo, tunnelMat);
        tunnelMesh.rotation.x = Math.PI / 2; // 讓圓柱體躺平，朝向相機
        scene.add(tunnelMesh);

        // --- 5. 背景星塵 ---
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 150; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.2, color: '#00f3ff', transparent: true, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 6. 動畫迴圈與狀態變數 ---
        const clock = new THREE.Clock();
        // 用一個物件來控制粒子的飛行速度，方便 GSAP 操作
        const simState = { warpSpeed: 0.1, tunnelZ: 0 }; 

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 核心蠕動
            coreUniforms.uTime.value = elapsedTime * 3.0;
            coreMesh.rotation.y += 0.005; coreMesh.rotation.x += 0.002;

            // 隧道無限滾動效果 (改變位置並重置)
            simState.tunnelZ += simState.warpSpeed * 2;
            if(simState.tunnelZ > 10) simState.tunnelZ = 0; // 無縫接軌
            tunnelMesh.position.z = simState.tunnelZ;

            // 星塵高速飛行
            const positions = particlesGeometry.attributes.position.array;
            for(let i = 2; i < particlesCount * 3; i += 3) {
                positions[i] += simState.warpSpeed; 
                if(positions[i] > 40) positions[i] = -100;
            }
            particlesGeometry.attributes.position.needsUpdate = true;

            composer.render();
        }
        animate();

        // --- 7. 【電影級分鏡】GSAP 點擊動畫 ---
        document.getElementById('login-btn').addEventListener('click', () => {
            const tl = gsap.timeline();

            // [Phase 1: 球體砸向按鈕 (Smash)]
            // 讓 HUD 文字先淡出
            tl.to(".main-title", { duration: 0.3, opacity: 0, y: -20, ease: "power2.in" });
            
            // 核心暴走變形，並往下、往前「砸向」螢幕上的按鈕位置！
            tl.to(coreUniforms.uDistortion, { duration: 0.5, value: 5.0, ease: "power2.in" }, 0);
            tl.to(coreMesh.position, { duration: 0.5, y: -15, z: 35, ease: "power4.in" }, 0); 
            
            // 砸到的瞬間：按鈕震動、粉碎消失，核心隱藏
            tl.to("#login-btn", { duration: 0.1, scale: 1.5, opacity: 0, filter: "blur(10px)" }, 0.45);
            tl.to(coreMaterial, { duration: 0.1, opacity: 0 }, 0.45);
            tl.to(bloomPass, { duration: 0.2, strength: 5.0 }, 0.45); // 砸擊閃光
            tl.to(bloomPass, { duration: 0.5, strength: 1.5 }, 0.65); // 閃光消退

            // [Phase 2: 啟動隧道躍遷 (Warp Tunnel)]
            // 線框隧道浮現，粒子速度暴增
            tl.to(tunnelMat, { duration: 1, opacity: 0.2, ease: "power2.out" }, 0.5);
            tl.to(simState, { duration: 2, warpSpeed: 5.0, ease: "power3.in" }, 0.5);
            
            // 更改色調，變成 SAO 的螢光綠/青色
            tl.to(particlesMaterial.color, { duration: 1, r: 0, g: 1, b: 0.4 }, 0.5);
            tl.to(tunnelMat.color, { duration: 1, r: 0, g: 1, b: 0.4 }, 0.5);

            // [Phase 3: SAO 五重感官確認]
            tl.call(() => {
                document.getElementById('main-hud').style.display = 'none';
                document.getElementById('sao-sequence').style.display = 'block';
            }, null, 1.5);

            // 依序點亮 5 個同心環，帶有強烈彈性動畫
            const rings = [1, 2, 3, 4, 5];
            rings.forEach((num, index) => {
                tl.to(`#ring-${num}`, { 
                    duration: 0.6, opacity: 1, scale: 1, 
                    ease: "back.out(1.5)" 
                }, 1.5 + (index * 0.3));
                
                // 同步顯示右側的感官 OK 列表
                tl.to(`#sense-${num}`, { 
                    duration: 0.1, color: "var(--sao-green)", textShadow: "0 0 10px var(--sao-green)" 
                }, 1.6 + (index * 0.3));
                tl.to(`#sense-${num} span`, { 
                    duration: 0.1, color: "var(--sao-green)" 
                }, 1.7 + (index * 0.3));
            });

            // [Phase 4: 最終登入 (FULL DIVE)]
            // 全部環點亮後，環加速旋轉並放大消失
            tl.to(".sao-ring", { duration: 1.5, scale: 3, opacity: 0, stagger: 0.1, ease: "power3.in" }, "+=0.5");
            tl.to(".sao-list", { duration: 0.5, x: 100, opacity: 0, ease: "power2.in" }, "-=1.5");
            
            // 中間顯示 FULL DIVE
            tl.to(".link-start-text", { duration: 0.5, opacity: 1, scale: 1.2, ease: "back.out(2)" }, "-=1.0");
            
            // 終極白畫面閃屏 (轉場)
            tl.to("#white-flash", { duration: 1, opacity: 1, ease: "power2.in" }, "+=0.5");
            tl.call(() => {
                alert("FULL DIVE: SUCCESS. WELCOME TO AINCRAD.");
                // location.href = "your-next-page.html";
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
