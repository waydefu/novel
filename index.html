<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片純程式散景模糊特效</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #222; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
        canvas { display: block; max-width: 90vw; max-height: 90vh; border: 2px solid #444; cursor: col-resize; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="loading">圖片載入中... (請確保使用伺服器開啟此 HTML)</div>
    <canvas id="canvas"></canvas>
    <script>
        "use strict";

        // --- 設定：在在此處替換您的圖片檔案路徑 ---
        const IMAGE_SRC = '13983bcae05ad17b7e79682df8c5917a.jpg'; // <--- 替換成您的圖片路徑 (請放置在同一目錄)

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous"; // 嘗試處理跨域問題 (本地伺服器通常不需要)
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('圖片載入失敗，請檢查路徑或瀏覽器安全設定 (CORS)。'));
                img.src = src;
            });
        }

        async function init() {
            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl2');

            if (!gl) {
                alert("抱歉，您的瀏覽器不支援 WebGL 2.0");
                return;
            }

            try {
                // 1. 載入外部圖片
                const img = await loadImage(IMAGE_SRC);
                document.getElementById('loading').style.display = 'none';

                // 2. 設置畫布大小與圖片比例一致
                canvas.width = img.width;
                canvas.height = img.height;
                gl.viewport(0, 0, canvas.width, canvas.height);

                // 滑鼠互動控制模糊程度
                let mouseX = 0.5; // 預設中間
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouseX = (e.clientX - rect.left) / rect.width;
                });

                // --- 著色器源代碼 (GLSL ES 3.00) ---
                const vsSource = `#version 300 es
                    in vec4 aPosition;
                    in vec2 aTexCoord; // 從 JS 傳入的紋理座標
                    out vec2 vTexCoord; // 傳給 fragment shader
                    void main() {
                        gl_Position = aPosition;
                        vTexCoord = aTexCoord;
                    }
                `;

                const fsSource = `#version 300 es
                    precision highp float;
                    out vec4 outColor;
                    uniform sampler2D uTexture; // 傳入的圖片紋理
                    uniform float uBlurRadius; // 模糊半徑uniform
                    in vec2 vTexCoord;

                    void main() {
                        // 1. 純程式模糊演算法：簡易散景模糊 (Bokeh Blur)
                        // 我們取樣本點周圍一定半徑內的像素顏色，並計算平均值。
                        
                        // 定義樣本點數量 (越大越模糊但效能越差)
                        const int SAMPLES = 32;
                        const float PI2 = 6.28318530718;
                        
                        vec3 accCol = vec3(0.0);
                        float accWeight = 0.0;
                        
                        // 隨著模糊半徑增加，我們採樣更廣泛的區域
                        for (int i = 0; i < SAMPLES; i++) {
                            float fI = float(i);
                            float p = fI * PI2 / float(SAMPLES);
                            float r = sqrt(fI / float(SAMPLES)) * uBlurRadius; // sqrt() 使分佈更均勻
                            
                            // 計算採樣點的偏移量
                            vec2 offset = vec2(cos(p), sin(p)) * r;
                            
                            // 採樣並疊加
                            vec3 col = texture(uTexture, vTexCoord + offset).rgb;
                            accCol += col;
                            accWeight += 1.0;
                        }
                        
                        // 2. 伽馬校正與輸出
                        vec3 finalCol = accCol / accWeight;
                        outColor = vec4(finalCol, 1.0);
                    }
                `;

                // --- WebGL 輔助編譯程式 ---
                function createProgram(gl, vsS, fsS) {
                    const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, vsS); gl.compileShader(vs);
                    const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, fsS); gl.compileShader(fs);
                    const program = gl.createProgram(); gl.attachShader(program, vs); gl.attachShader(program, fs); gl.linkProgram(program);
                    gl.deleteShader(vs); gl.deleteShader(fs); return program;
                }
                const program = createProgram(gl, vsSource, fsSource);

                // --- 設置屬性與緩衝區 (全螢幕四邊形) ---
                const positionBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
                gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
                const aPosition = gl.getAttribLocation(program, 'aPosition');
                gl.enableVertexAttribArray(aPosition);
                gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

                const texCoordBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
                const texCoords = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
                gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
                const aTexCoord = gl.getAttribLocation(program, 'aTexCoord');
                gl.enableVertexAttribArray(aTexCoord);
                gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 0, 0);

                // --- 將圖片轉換為 WebGL 紋理 ---
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

                // --- 渲染循環 ---
                gl.useProgram(program);
                const uTexture = gl.getUniformLocation(program, 'uTexture');
                const uBlurRadius = gl.getUniformLocation(program, 'uBlurRadius');

                function render() {
                    // 將滑鼠的 X 座標映射為模糊半徑 (0.01 是模糊極大值)
                    float maxRadius = 0.01;
                    float blurRadius = mouseX * maxRadius;
                    gl.uniform1f(uBlurRadius, blurRadius); // 將模糊半徑傳入 uniformly

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(uTexture, 0);

                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    requestAnimationFrame(render);
                }
                requestAnimationFrame(render);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = '<span style="color:red">圖片載入失敗！</span><br><br>這通常是因為瀏覽器限制了從硬碟載入圖片。<br><br>請使用 VS Code 的 "Live Server" 擴充功能，或將此網頁上傳到 GitHub Pages 等伺服器環境中。';
            }
        }

        init();
    </script>
</body>
</html>
