<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fantasy Lore Guardian - SAO Adaptive Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --obsidian: #050505;
            --dark-gold: #b38030;
            --amber: #ff9900;
            --ember-red: #ff3300;
            --ash: #888888;
            --font-en: 'Cinzel', serif;
            --font-tw: 'Noto Serif TC', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background-color: var(--obsidian);
            color: var(--dark-gold);
            font-family: var(--font-tw);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* WebGL Background */
        #webgl-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        /* Global UI Layer */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 2rem;
            background: radial-gradient(circle at center, transparent 30%, rgba(5,5,5,0.9) 100%);
        }

        @media (max-width: 600px) {
            #ui-layer { padding: 1rem; }
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; z-index: 999; pointer-events: none; opacity: 0.2;
        }

        .sys-text-en { font-family: var(--font-en); font-size: 0.7rem; letter-spacing: 2px; color: var(--amber); opacity: 0.7; }
        
        /* Top HUD Layout */
        #hud-top { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
        .top-center { text-align: center; }
        .top-center h1 { font-family: var(--font-en); font-size: 1.5rem; letter-spacing: 8px; color: var(--dark-gold); }
        .top-center p { font-family: var(--font-tw); font-size: 0.8rem; letter-spacing: 5px; color: var(--ash); margin-top: 5px; }

        @media (max-width: 768px) {
            .sys-text-en { display: none; }
            .top-center { width: 100%; }
            .top-center h1 { font-size: 1.2rem; letter-spacing: 4px; }
        }

        /* SAO Style Floating Windows - Centering System */
        .sao-window {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); 
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--dark-gold);
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(179,128,48,0.15);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform-origin: center center;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            z-index: 50;
        }

        .sao-header {
            background: rgba(179, 128, 48, 0.2);
            border-bottom: 1px solid var(--dark-gold);
            padding: 10px 15px;
            font-family: var(--font-en);
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--amber);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sao-body { padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .sao-prompt { font-size: 0.9rem; color: var(--ash); line-height: 1.6; letter-spacing: 2px; }

        .sao-input-group { position: relative; }
        .sao-input {
            width: 100%; background: rgba(0,0,0,0.4); border: none; border-bottom: 1px solid rgba(179,128,48,0.4);
            color: var(--amber); font-family: var(--font-tw); font-size: 1rem; padding: 12px 5px;
            outline: none; transition: all 0.3s ease; letter-spacing: 2px;
        }
        .sao-input::placeholder { color: rgba(136, 136, 136, 0.4); }
        .sao-input:focus { border-bottom-color: var(--amber); box-shadow: 0 5px 15px -5px rgba(255,153,0,0.3); background: rgba(179,128,48,0.05); }

        .sao-footer { display: flex; border-top: 1px solid rgba(179, 128, 48, 0.3); margin-top: auto; }
        .sao-btn {
            flex: 1; background: transparent; border: none; color: var(--ash);
            font-family: var(--font-tw); font-size: 0.95rem; padding: 14px 0;
            cursor: pointer; transition: all 0.2s; letter-spacing: 3px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .sao-btn:hover { background: rgba(179, 128, 48, 0.15); color: var(--amber); }
        .sao-btn.confirm { border-left: 1px solid rgba(179, 128, 48, 0.3); }
        .sao-btn.confirm:hover { color: var(--dark-gold); text-shadow: 0 0 10px var(--amber); }
        .sao-btn.cancel:hover { color: var(--ember-red); text-shadow: 0 0 10px var(--ember-red); }

        #sao-auth {
            width: calc(100% - 2rem);
            max-width: 400px;
        }

        #sao-warning {
            width: calc(100% - 2rem);
            max-width: 460px;
            border-color: var(--ember-red);
            box-shadow: 0 0 40px rgba(255,51,0,0.25), inset 0 0 15px rgba(255,51,0,0.15);
            display: none;
            z-index: 100;
        }
        #sao-warning .sao-header { background: rgba(255, 51, 0, 0.2); border-bottom-color: var(--ember-red); color: var(--ember-red); }
        #sao-warning .sao-prompt { color: var(--dark-gold); text-align: center; }

        /* Operational Mode Overlay */
        #operational-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0; pointer-events: none; z-index: 20; width: 90%;
        }
        #operational-msg h2 { font-family: var(--font-tw); font-size: 2.5rem; letter-spacing: 15px; color: var(--amber); text-shadow: 0 0 30px var(--ember-red); margin-bottom: 10px;}
        #operational-msg p { font-family: var(--font-en); font-size: 1rem; letter-spacing: 8px; color: var(--dark-gold); }

        @media (max-width: 600px) {
            #operational-msg h2 { font-size: 1.8rem; letter-spacing: 8px; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div class="scanlines"></div>
    <div id="webgl-container"></div>

    <div id="ui-layer">
        <div id="hud-top">
            <div class="sys-text-en">ARCHIVE COORDINATES<br>N 45.29 / W 12.08</div>
            <div class="top-center">
                <h1>ELDRUNE EDITORIUM</h1>
                <p>西方奇幻小說編修引擎</p>
            </div>
            <div class="sys-text-en" style="text-align: right;">DIMENSIONAL SEAL<br>INTACT</div>
        </div>

        <div id="sao-auth" class="sao-window">
            <div class="sao-header">
                <span>[ ! ]</span>
                <span>AUTH_REQUIRED</span>
            </div>
            <div class="sao-body">
                <p class="sao-prompt">系統偵測到抄寫員印記。<br>請注入奧術密鑰以開啟編修儀式。</p>
                <div class="sao-input-group">
                    <input type="text" class="sao-input" placeholder="輸入作者印記...">
                </div>
                <div class="sao-input-group">
                    <input type="password" class="sao-input" placeholder="輸入奧術密鑰...">
                </div>
            </div>
            <div class="sao-footer">
                <button class="sao-btn cancel" onclick="triggerGlitch()">✕ 拒絕</button>
                <button class="sao-btn confirm" id="btn-initiate">◯ 執行</button>
            </div>
        </div>

        <div id="sao-warning" class="sao-window">
            <div class="sao-header">
                <span>[ ⚠️ ]</span>
                <span>SYSTEM_OVERRIDE</span>
            </div>
            <div class="sao-body">
                <p class="sao-prompt">警告：解除禁忌封印可能導致現實認知崩壞。<br><br>即將連線至深淵世界觀核心，是否強制同步？</p>
            </div>
            <div class="sao-footer">
                <button class="sao-btn cancel" id="btn-abort">✕ 中斷</button>
                <button class="sao-btn confirm" id="btn-force-sync" style="color: var(--ember-red);">◯ 強制同步</button>
            </div>
        </div>

        <div></div>
    </div>

    <div id="operational-msg">
        <h2>世界觀核心已啟動</h2>
        <p>EDITORIAL MODE ONLINE</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        /* 1. Scene Setup & Camera */
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        /* 2. Post-Processing Pipeline */
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2; bloomPass.strength = 1.2; bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        /* 3. Procedural Shaders */
        const runeVertexShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
        const runeFragmentShader = `
            uniform float uTime; uniform vec3 uColor; uniform float uDensity; varying vec2 vUv;
            float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
            void main() {
                float segment = floor(vUv.x * uDensity); float id = hash(vec2(segment, 1.0));
                float flicker = sin(uTime * id * 5.0) * 0.5 + 0.5;
                float shape = step(0.5, hash(vec2(segment, floor(vUv.y * 5.0))));
                float alpha = shape * flicker * (id > 0.3 ? 1.0 : 0.0);
                alpha *= smoothstep(0.0, 0.1, vUv.y) * smoothstep(1.0, 0.9, vUv.y);
                gl_FragColor = vec4(uColor, alpha * 0.8);
            }
        `;

        const coreVertexShader = `
            uniform float uTime; uniform float uDistortion; varying vec2 vUv; varying vec3 vNormal;
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) { 
                const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))+i.y+vec4(0.0, i1.y, i2.y, 1.0))+i.x+vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw); vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                return 42.0 * dot(m*m*m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
            void main() {
                vUv = uv; vNormal = normal;
                float noise = snoise(position * 2.0 + uTime * 0.5) * uDistortion;
                vec3 newPos = position + normal * noise;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `;
        const coreFragmentShader = `
            uniform float uTime; uniform float uIntensity; varying vec2 vUv; varying vec3 vNormal;
            void main() {
                float fresnel = pow(clamp(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 3.0);
                vec3 finalColor = mix(vec3(0.02), vec3(1.0, 0.6, 0.0), fresnel * uIntensity);
                finalColor += vec3(1.0, 0.2, 0.0) * (sin(uTime * 2.0) * 0.5 + 0.5) * (1.0-fresnel) * uIntensity * 0.5;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        /* 4. Object Creation */
        const systemGroup = new THREE.Group(); scene.add(systemGroup);
        const coreMaterial = new THREE.ShaderMaterial({ vertexShader: coreVertexShader, fragmentShader: coreFragmentShader, uniforms: { uTime: { value: 0 }, uDistortion: { value: 0.1 }, uIntensity: { value: 1.0 } } });
        systemGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2, 4), coreMaterial));

        const runeRings = [];
        const ringCount = window.innerWidth < 600 ? 12 : 24;
        for (let i = 0; i < ringCount; i++) {
            const mat = new THREE.ShaderMaterial({
                vertexShader: runeVertexShader, fragmentShader: runeFragmentShader,
                uniforms: { uTime: { value: 0 }, uColor: { value: [new THREE.Color(0xb38030), new THREE.Color(0xff9900), new THREE.Color(0xff3300)][i%3] }, uDensity: { value: 20.0 + Math.random() * 80.0 } },
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5 + (i * 0.25), 0.02 + Math.random() * 0.03, 3, 100), mat);
            ring.rotation.set(Math.random() * 6.28, Math.random() * 6.28, 0);
            ring.userData = { axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(), speed: (Math.random() * 0.005 + 0.001) * (Math.random() > 0.5 ? 1 : -1) };
            ring.userData.baseSpeed = ring.userData.speed;
            runeRings.push(ring); systemGroup.add(ring);
        }

        /* 5. GSAP SAO UI Logic */
        setTimeout(() => {
            gsap.fromTo('#sao-auth', 
                { scaleY: 0.02, scaleX: 0, opacity: 0, xPercent: -50, yPercent: -50 }, 
                { scaleX: 1, opacity: 1, duration: 0.2, ease: "power2.out" }
            );
            gsap.to('#sao-auth', { scaleY: 1, duration: 0.3, ease: "back.out(1.2)", delay: 0.2 });
        }, 1000);

        window.triggerGlitch = () => {
            gsap.to('#sao-auth', { x: "+=10", yoyo: true, repeat: 5, duration: 0.05 });
            gsap.to('#sao-auth', { borderColor: "var(--ember-red)", duration: 0.1, yoyo: true, repeat: 1 });
        };

        document.getElementById('btn-initiate').addEventListener('click', () => {
            gsap.to('#sao-auth', { filter: "blur(5px)", opacity: 0.3, scale: 0.95, duration: 0.3 });
            
            const warning = document.getElementById('sao-warning');
            warning.style.display = 'flex';
            gsap.fromTo(warning, 
                { scaleY: 0.02, scaleX: 0, opacity: 0, xPercent: -50, yPercent: -50 }, 
                { scaleX: 1, opacity: 1, duration: 0.15, ease: "power2.out" }
            );
            gsap.to(warning, { scaleY: 1, duration: 0.25, ease: "back.out(1.5)", delay: 0.15 });
        });

        document.getElementById('btn-abort').addEventListener('click', () => {
            gsap.to('#sao-warning', { scaleY: 0.02, opacity: 0, duration: 0.2, onComplete: () => {
                document.getElementById('sao-warning').style.display = 'none';
            }});
            gsap.to('#sao-auth', { filter: "blur(0px)", opacity: 1, scale: 1, duration: 0.3, delay: 0.1 });
        });

        document.getElementById('btn-force-sync').addEventListener('click', () => {
            gsap.to('.sao-window', { scaleY: 0.02, opacity: 0, duration: 0.2, stagger: 0.05, onComplete: () => {
                document.querySelectorAll('.sao-window').forEach(el => el.style.display = 'none');
            }});

            gsap.to(bloomPass, { strength: 4.0, radius: 1.2, threshold: 0.1, duration: 1.5, ease: "expo.in" });
            gsap.to(coreMaterial.uniforms.uDistortion, { value: 0.8, duration: 1.5 });
            gsap.to(coreMaterial.uniforms.uIntensity, { value: 3.0, duration: 1.5 });
            
            runeRings.forEach((r, index) => {
                gsap.to(r.userData, { speed: r.userData.baseSpeed * 20, duration: 2, ease: "power3.in" });
                gsap.to(r.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 1.5, delay: index*0.01 });
            });

            setTimeout(() => {
                scene.background = new THREE.Color(0xffaa00);
                gsap.to(scene.background, { r: 0.02, g: 0.02, b: 0.02, duration: 1.5, ease: "power2.out" });
                gsap.to(bloomPass, { strength: 1.0, radius: 0.5, duration: 2 });
                gsap.to(coreMaterial.uniforms.uDistortion, { value: 0.2, duration: 2 });
                gsap.to(coreMaterial.uniforms.uIntensity, { value: 1.2, duration: 2 });
                gsap.to(camera.position, { z: window.innerWidth < 600 ? 12 : 10, duration: 3, ease: "power3.out" });

                runeRings.forEach(r => {
                    gsap.to(r.userData, { speed: r.userData.baseSpeed * 1.5, duration: 2 });
                    gsap.to(r.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 2 });
                });

                gsap.to(document.getElementById('operational-msg'), { opacity: 1, duration: 2, ease: "power1.inOut" });
            }, 1800);
        });

        /* 6. Animation Loop */
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            coreMaterial.uniforms.uTime.value = time;
            runeRings.forEach((ring) => {
                ring.material.uniforms.
