<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧之王拉斐爾｜System Raphael</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --core-bg: #040b16;
      --cyan-glow: #00d4ff;
      --silver-white: #e2e8f0;
      --raphael-gold: #ffd700;
      --data-line: rgba(0, 212, 255, 0.3);
      --font-mono: 'Share Tech Mono', monospace;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--core-bg);
      color: var(--cyan-glow);
      font-family: var(--font-mono);
      overflow: hidden;
      user-select: none;
    }
    #webgl-container { position: fixed; inset: 0; z-index: 1; }
    
   .hud {
      position: fixed; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column;
      justify-content: space-between;
      width: 100%; height: 100%;
      padding: 30px; box-sizing: border-box;
    }
   .header {
      display: flex; justify-content: space-between;
      border-bottom: 1px solid var(--data-line);
      padding-bottom: 10px;
    }
   .title h1 {
      margin: 0; font-size: 24px; color: var(--raphael-gold);
      letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }
   .title p { margin: 5px 0 0; font-size: 12px; letter-spacing: 2px; color: var(--silver-white); }
    
   .status-panel { text-align: right; }
   .status-panel.readout { font-size: 28px; color: var(--silver-white); }
    
   .controls {
      pointer-events: auto;
      display: flex; gap: 15px;
    }
    button {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      font-family: var(--font-mono);
      padding: 10px 20px; cursor: pointer;
      font-size: 14px; letter-spacing: 2px;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    button:hover {
      background: var(--cyan-glow);
      color: var(--core-bg);
      box-shadow: 0 0 15px var(--cyan-glow);
    }
    button.gold {
      border-color: var(--raphael-gold);
      color: var(--raphael-gold);
    }
    button.gold:hover {
      background: var(--raphael-gold);
      color: var(--core-bg);
      box-shadow: 0 0 15px var(--raphael-gold);
    }
   .notice {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px; letter-spacing: 6px;
      color: var(--silver-white);
      text-shadow: 0 0 20px var(--cyan-glow);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>
  
  <div class="hud">
    <div class="header">
      <div class="title">
        <h1>WISDOM KING RAPHAEL</h1>
        <p>THOUGHT ACCELERATION // PARALLEL CALCULATION</p>
      </div>
      <div class="status-panel">
        <div id="sync-text">ANALYSIS PROGRESS</div>
        <div class="readout" id="sync-readout">100%</div>
      </div>
    </div>
    
    <div class="notice" id="center-notice">EXECUTING...</div>

    <div class="controls">
      <button id="btn-parallel">Parallel Calculation</button>
      <button id="btn-devour" class="gold">Ultimate: Beelzebuth</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // 1. 動態生成代表魔法文字的極座標紋理 (模擬羅馬變體字)
    function createRuneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000000'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const text = "THOUGHT ACCELERATION // ANALYTICAL APPRAISAL // ALL OF CREATION // RAPHAEL // SYSTEM ONLINE // ";
      ctx.fillText(text.repeat(4), canvas.width / 2, canvas.height / 2);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // 2. 初始化 Three.js 場景與後處理
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040b16);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // HDR 泛光效果 (大賢者高潔的光暈)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.85, 0.2);
    composer.addPass(bloomPass);

    // 3. 核心魔法陣著色器 (包含二維 SDF 幾何與暴食之王的三維頂點扭曲)
    const coreUniforms = {
      uTime: { value: 0 },
      uDevour: { value: 0 },
      uParallel: { value: 0 },
      uRuneTexture: { value: createRuneTexture() }
    };

    const coreMaterial = new THREE.ShaderMaterial({
      uniforms: coreUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float uDevour;
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        // 簡單噪聲用於暴食之王的空間擾動
        float hash(float n) { return fract(sin(n) * 1e4); }
        float noise(vec3 x) {
          vec3 i = floor(x); vec3 f = fract(x);
          float n = i.x + i.y * 157.0 + i.z * 113.0;
          return mix(mix(mix(hash(n), hash(n+1.0), f.x), mix(hash(n+157.0), hash(n+158.0), f.x), f.y),
                     mix(mix(hash(n+113.0), hash(n+114.0), f.x), mix(hash(n+270.0), hash(n+271.0), f.x), f.y), f.z);
        }

        void main() {
          vUv = uv;
          vec2 pos2D = position.xy;
          float dist = length(pos2D);

          // 球面投影半徑
          float R = 4.8; 
          float sphereZ = sqrt(max(0.0, R*R - dist*dist));

          // 在平面與球面(暴食之王)之間進行內插
          vec3 flatPos = vec3(pos2D, 0.0);
          vec3 spherePos = vec3(pos2D, R - sphereZ); // 向鏡頭突起或凹陷

          float turbulence = noise(vec3(pos2D * 2.0, uTime)) * 0.5 * uDevour;
          vec3 finalPos = mix(flatPos, spherePos, uDevour) + normal * turbulence;

          // 計算菲涅耳效應用的法向量
          vec3 sphereNormal = normalize(vec3(pos2D, sphereZ));
          vec3 finalNormal = mix(vec3(0.0, 0.0, 1.0), sphereNormal, uDevour);
          vNormal = normalize(normalMatrix * finalNormal);

          vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uDevour;
        uniform float uParallel;
        uniform sampler2D uRuneTexture;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        #define PI 3.14159265359
        #define TWO_PI 6.28318530718

        // SDF: 繪製正多邊形 (鍊金術元素符號)
        float sdPolygon(vec2 p, int vertices, float size) {
          float a = atan(p.x, p.y) + PI;
          float r = TWO_PI / float(vertices);
          float d = cos(floor(0.5 + a / r) * r - a) * length(p);
          return smoothstep(size, size + 0.015, d) - smoothstep(size + 0.02, size + 0.035, d);
        }

        // 繪製多重同心圓
        float drawConcentricRings(vec2 p, float count, float speed) {
          float r = length(p);
          float rings = sin(r * count - uTime * speed);
          return smoothstep(0.85, 0.95, rings);
        }

        // 極座標映射: 繪製環形文字
        vec4 getPolarRune(vec2 p, float innerR, float outerR, float speed) {
          float r = length(p);
          if (r < innerR || r > outerR) return vec4(0.0);
          float angle = atan(p.y, p.x);
          float u = (angle + PI) / TWO_PI;
          
          // 思考加速: 階躍式時間變化
          float steppedTime = floor(uTime * 15.0) * 0.066;
          float actualTime = mix(uTime, steppedTime, uParallel);
          
          u = fract(u * 3.0 + actualTime * speed); 
          float v = (r - innerR) / (outerR - innerR);
          vec4 tex = texture2D(uRuneTexture, vec2(u, v));
          return tex * smoothstep(innerR, innerR+0.05, r) * smoothstep(outerR, outerR-0.05, r);
        }

        void main() {
          vec2 p = (vUv - 0.5) * 10.0;
          float r = length(p);

          vec3 cyan = vec3(0.0, 0.83, 1.0);
          vec3 silver = vec3(0.9, 0.95, 1.0);
          vec3 gold = vec3(1.0, 0.84, 0.0);

          // 中心鍊金術圖形 (三角形代表火元素等)
          float tri = sdPolygon(p, 3, 1.2);
          float hex = sdPolygon(p, 6, 2.2);
          float rings = drawConcentricRings(p, 12.0, 3.0) * step(r, 4.2);

          // 魔法符文環
          vec4 rune1 = getPolarRune(p, 2.8, 3.4, 0.4 * (1.0 + uParallel * 5.0));
          vec4 rune2 = getPolarRune(p, 3.5, 4.1, -0.6 * (1.0 + uParallel * 3.0));

          float baseShape = tri + hex + (rings * 0.4);
          
          // 色彩組合: 核心青色，邊緣與運算時偏向金銀色
          vec3 color = mix(cyan, silver, step(r, 1.5)) * baseShape;
          color += rune1.rgb * cyan + rune2.rgb * mix(cyan, gold, uDevour);

          // 切割外部圓形邊緣
          color *= smoothstep(4.9, 4.8, r);

          // 暴食之王: Fresnel 邊緣發光效應
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - clamp(dot(normalize(vNormal), viewDir), 0.0, 1.0), 2.5);
          float edgeVisibility = mix(1.0, fresnel, uDevour);

          float alpha = clamp(max(baseShape, max(rune1.r, rune2.r)), 0.0, 1.0) * edgeVisibility;
          
          // 暴食之王中心黑暗化 (吞噬視界)
          alpha *= mix(1.0, smoothstep(0.1, 0.6, fresnel), uDevour);

          if (alpha < 0.01) discard;

          // 根據參數增強發光強度
          gl_FragColor = vec4(color * (1.2 + uParallel * 0.5 + uDevour * 1.5), alpha);
        }
      `
    });

    // 魔法陣本體
    const magicCircle = new THREE.Mesh(new THREE.PlaneGeometry(10, 10, 64, 64), coreMaterial);
    scene.add(magicCircle);

    // 4. 魔素粒子系統 (受控的螺旋流體動力學)
    const particleCount = 1200;
    const pGeometry = new THREE.BufferGeometry();
    const pPositions = new Float32Array(particleCount * 3);
    const pSeeds = new Float32Array(particleCount);
    
    const pData =;
    for(let i=0; i<particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 1.0 + Math.random() * 8.0;
      pSeeds[i] = Math.random();
      pData.push({ angle, radius, speed: 0.2 + Math.random() * 0.5 });
    }
    pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeometry.setAttribute('aSeed', new THREE.BufferAttribute(pSeeds, 1));

    const pMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDevour: { value: 0 }
      },
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      vertexShader: `
        uniform float uTime;
        uniform float uDevour;
        attribute float aSeed;
        varying float vSeed;
        void main() {
          vSeed = aSeed;
          vec3 pos = position;
          // 暴食之王發動時，粒子向 Z 軸拉扯
          pos.z += sin(uTime * 2.0 + aSeed * 10.0) * mix(0.1, 3.0, uDevour);
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = (4.0 + aSeed * 4.0) * (15.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying float vSeed;
        uniform float uDevour;
        void main() {
          float dist = length(gl_PointCoord - 0.5);
          float alpha = smoothstep(0.5, 0.1, dist);
          vec3 cyan = vec3(0.0, 0.83, 1.0);
          vec3 silver = vec3(0.9, 0.95, 1.0);
          vec3 gold = vec3(1.0, 0.84, 0.0);
          // 粒子顏色: 混和青色、銀白與發動技能時的金色
          vec3 color = mix(cyan, silver, step(0.5, fract(vSeed * 3.1)));
          color = mix(color, gold, uDevour * step(0.8, fract(vSeed * 7.2)));
          gl_FragColor = vec4(color, alpha * (0.3 + 0.7 * fract(vSeed * 5.0)));
        }
      `
    });
    const particles = new THREE.Points(pGeometry, pMaterial);
    scene.add(particles);

    // 5. 動畫迴圈與邏輯更新
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const delta = clock.getDelta();
      
      coreMaterial.uniforms.uTime.value = time;
      pMaterial.uniforms.uTime.value = time;

      // 更新粒子軌跡 (對數螺旋匯聚)
      const positions = pGeometry.attributes.position.array;
      const devourVal = coreMaterial.uniforms.uDevour.value;
      const parallelVal = coreMaterial.uniforms.uParallel.value;
      
      for(let i=0; i<particleCount; i++) {
        const pd = pData[i];
        // 運算加速時增加角速度
        pd.angle += pd.speed * 0.016 * (1.0 + parallelVal * 10.0 + devourVal * 5.0);
        // 暴食之王發動時，軌道向中心收縮
        const currentR = pd.radius * (1.0 - devourVal * 0.8);
        
        positions[i*3] = Math.cos(pd.angle) * currentR;
        positions[i*3+1] = Math.sin(pd.angle) * currentR;
      }
      pGeometry.attributes.position.needsUpdate = true;

      // 輕微旋轉魔法陣
      magicCircle.rotation.z = -time * 0.1;

      composer.render();
    }
    animate();

    // 處理視窗縮放
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. GSAP UI 互動邏輯 (精確的階躍式動畫)
    const btnParallel = document.getElementById('btn-parallel');
    const btnDevour = document.getElementById('btn-devour');
    const readout = document.getElementById('sync-readout');
    const notice = document.getElementById('center-notice');

    let isParallel = false;
    btnParallel.addEventListener('click', () => {
      isParallel =!isParallel;
      btnParallel.style.background = isParallel? 'rgba(0, 212, 255, 0.4)' : '';
      
      // 觸發階躍式數據跳動模擬大賢者解析
      gsap.to(readout, {
        innerHTML: isParallel? 1000 : 100,
        duration: 1.5,
        ease: "steps(10)",
        snap: { innerHTML: 1 },
        onUpdate: function() { readout.innerHTML = Math.floor(this.targets().innerHTML) + "%"; }
      });

      gsap.to(coreMaterial.uniforms.uParallel, {
        value: isParallel? 1 : 0,
        duration: 0.5,
        ease: "expo.out"
      });
      
      showNotice(isParallel? "PARALLEL CALCULATION: ACTIVE" : "CALCULATION: NORMAL");
    });

    let isDevour = false;
    btnDevour.addEventListener('click', () => {
      isDevour =!isDevour;
      btnDevour.style.background = isDevour? 'rgba(255, 215, 0, 0.4)' : '';
      
      // 扭曲魔法陣維度，變形為吞噬球體
      gsap.to(coreMaterial.uniforms.uDevour, {
        value: isDevour? 1 : 0,
        duration: 1.2,
        ease: isDevour? "expo.out" : "power3.inOut"
      });
      
      // 攝影機拉近震動感
      gsap.to(camera.position, {
        z: isDevour? 12 : 15,
        duration: 1.2,
        ease: "back.out(1.5)"
      });

      showNotice(isDevour? "ULTIMATE SKILL: BEELZEBUTH" : "SKILL DEACTIVATED");
    });

    function showNotice(text) {
      notice.innerText = text;
      gsap.fromTo(notice, 
        { opacity: 0, scale: 0.8 }, 
        { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }
      );
      gsap.to(notice, { opacity: 0, duration: 0.5, delay: 1.5 });
    }
  </script>
</body>
</html>
