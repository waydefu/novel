<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>NEXCORE ARCANE SYSTEM :: CINEMATIC EDITION</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
/>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
/>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;600;700&display=swap"
rel="stylesheet"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>

:root{

    --gold:#d4af37;
    --gold-soft:rgba(212,175,55,0.25);
    --gold-faint:rgba(212,175,55,0.05);

    --red:#ff2a2a;
    --ember:#ff6b00;

    --bg:#030303;

    --panel:
    linear-gradient(
        to bottom,
        rgba(18,18,18,0.7),
        rgba(0,0,0,0.88)
    );

    --font-main:'Orbitron',sans-serif;
    --font-sub:'Rajdhani',sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

    background:
    radial-gradient(
        circle at center,
        #150b08 0%,
        #050505 50%,
        #000 100%
    );

    color:white;

    font-family:var(--font-main);
}

#webgl-container{

    position:fixed;
    inset:0;

    z-index:1;
}

/* =====================================
   OVERLAY
===================================== */

.hud-overlay{

    position:fixed;
    inset:0;

    z-index:5;

    pointer-events:none;

    display:grid;

    grid-template-columns:
    minmax(240px,18vw)
    1fr
    minmax(240px,18vw);

    grid-template-rows:
    90px
    1fr
    140px;

    gap:1rem;

    padding:clamp(12px,2vw,28px);
}

/* =====================================
   PANELS
===================================== */

.hud-panel{

    opacity:0;

    background:var(--panel);

    border:
    1px solid
    rgba(212,175,55,0.18);

    backdrop-filter:blur(12px);

    box-shadow:

    0 0 30px rgba(212,175,55,0.08),

    inset 0 0 40px rgba(255,120,0,0.02);

    padding:14px;

    overflow:hidden;

    position:relative;
}

.hud-panel::before{

    content:'';

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.06),
        transparent
    );

    animation:scan 7s linear infinite;
}

@keyframes scan{

    100%{
        left:140%;
    }
}

.panel-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:14px;

    color:var(--gold);

    font-size:clamp(0.55rem,0.8vw,0.75rem);

    letter-spacing:0.35em;

    border-bottom:
    1px solid rgba(212,175,55,0.15);

    padding-bottom:8px;
}

.data-row{

    display:flex;
    justify-content:space-between;

    margin-bottom:8px;

    font-size:clamp(0.65rem,0.9vw,0.9rem);

    font-family:var(--font-sub);

    color:rgba(255,255,255,0.7);
}

.data-val{

    color:var(--gold);

    text-shadow:
    0 0 10px rgba(212,175,55,0.4);
}

/* =====================================
   TOP
===================================== */

.header-left{

    grid-column:1;
    grid-row:1;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.system-status{

    color:var(--gold);

    font-size:clamp(1rem,1.5vw,1.6rem);

    letter-spacing:0.4em;

    text-shadow:
    0 0 20px rgba(212,175,55,0.4);
}

.header-center{

    grid-column:2;
    grid-row:1;

    display:flex;
    justify-content:center;
    align-items:center;
}

.main-title{

    position:relative;

    font-size:
    clamp(2rem,5vw,5rem);

    font-weight:900;

    letter-spacing:
    clamp(0.4rem,1vw,1rem);

    color:var(--gold);

    text-shadow:

    0 0 20px rgba(212,175,55,0.5),

    0 0 60px rgba(255,120,0,0.25);
}

.main-title::after{

    content:'';

    position:absolute;

    bottom:-12px;
    left:0;

    width:100%;
    height:1px;

    background:
    linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
    );
}

/* =====================================
   LEFT / RIGHT
===================================== */

.left-col{

    grid-column:1;
    grid-row:2;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.right-col{

    grid-column:3;
    grid-row:2 / span 2;

    display:flex;
    flex-direction:column;
    gap:14px;
}

/* =====================================
   FOOTER
===================================== */

.footer-center{

    grid-column:2;
    grid-row:3;

    display:flex;
    justify-content:center;
    align-items:end;

    padding-bottom:20px;
}

.btn-engage{

    pointer-events:auto;

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        rgba(212,175,55,0.12),
        rgba(0,0,0,0.8)
    );

    border:
    1px solid rgba(212,175,55,0.3);

    color:var(--gold);

    padding:
    clamp(12px,1vw,18px)
    clamp(30px,5vw,80px);

    font-size:
    clamp(0.8rem,1vw,1rem);

    letter-spacing:0.45em;

    font-family:var(--font-main);

    cursor:pointer;

    transition:0.4s;
}

.btn-engage::before{

    content:'';

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );

    transition:0.7s;
}

.btn-engage:hover::before{
    left:120%;
}

.btn-engage:hover{

    transform:translateY(-2px);

    box-shadow:

    0 0 30px rgba(212,175,55,0.25),

    0 0 80px rgba(255,120,0,0.15);
}

/* =====================================
   BARS
===================================== */

.bar-chart{

    display:flex;
    align-items:end;

    height:120px;

    gap:5px;
}

.bar{

    flex:1;

    border-radius:3px;

    background:
    linear-gradient(
        to top,
        #ff2a2a,
        #d4af37
    );

    box-shadow:
    0 0 15px rgba(212,175,55,0.25);

    height:40%;
}

/* =====================================
   BOOT
===================================== */

.boot-screen{

    position:fixed;
    inset:0;

    z-index:20;

    background:black;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.boot-title{

    color:var(--gold);

    font-size:
    clamp(2rem,5vw,4rem);

    letter-spacing:0.6em;

    opacity:0;
}

.boot-sub{

    margin-top:20px;

    color:rgba(255,255,255,0.7);

    letter-spacing:0.4em;

    font-family:var(--font-sub);
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:960px){

    .hud-overlay{

        grid-template-columns:1fr;

        grid-template-rows:
        auto
        auto
        auto
        auto
        auto;

        overflow-y:auto;
    }

    .header-left{
        grid-column:1;
        grid-row:1;
    }

    .header-center{
        grid-column:1;
        grid-row:2;
    }

    .left-col{
        grid-column:1;
        grid-row:3;
    }

    .right-col{
        grid-column:1;
        grid-row:4;
    }

    .footer-center{
        grid-column:1;
        grid-row:5;
    }

    .main-title{

        text-align:center;

        line-height:1.2;
    }

    .hud-panel{

        min-height:auto;
    }
}

</style>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.150.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.150.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="webgl-container"></div>

<div class="boot-screen">

    <div class="boot-title">
        NEXCORE
    </div>

    <div class="boot-sub">
        ARCANE SYSTEM INITIALIZATION
    </div>

</div>

<div class="hud-overlay">

    <div class="hud-panel header-left">

        <div class="system-status">
            ACTIVE
        </div>

        <div style="font-size:12px;">
            ARCANE<br>
            INTERFACE
        </div>

    </div>

    <div class="header-center">

        <div class="main-title">
            NEXCORE
        </div>

    </div>

    <div class="left-col">

        <div class="hud-panel">

            <div class="panel-header">

                <span>TIME_SYNC</span>

                <span>LOCAL</span>

            </div>

            <div class="data-row">
                <span>DATE</span>
                <span class="data-val" id="date"></span>
            </div>

            <div class="data-row">
                <span>TIME</span>
                <span class="data-val" id="time"></span>
            </div>

            <div class="data-row">
                <span>UTC</span>
                <span class="data-val" id="utc"></span>
            </div>

        </div>

        <div class="hud-panel">

            <div class="panel-header">
                <span>SYSTEM_ANALYSIS</span>
            </div>

            <div class="data-row">
                <span>PLATFORM</span>
                <span class="data-val" id="platform"></span>
            </div>

            <div class="data-row">
                <span>CORES</span>
                <span class="data-val" id="cores"></span>
            </div>

            <div class="data-row">
                <span>LANG</span>
                <span class="data-val" id="lang"></span>
            </div>

        </div>

    </div>

    <div class="footer-center">

        <button
        class="btn-engage"
        id="engage-btn">

            SYNCHRONIZE

        </button>

    </div>

    <div class="right-col">

        <div class="hud-panel">

            <div class="panel-header">

                <span>DISPLAY_SYNC</span>

            </div>

            <div class="data-row">
                <span>WIDTH</span>
                <span class="data-val" id="width"></span>
            </div>

            <div class="data-row">
                <span>HEIGHT</span>
                <span class="data-val" id="height"></span>
            </div>

            <div class="data-row">
                <span>PIXEL_RATIO</span>
                <span class="data-val" id="ratio"></span>
            </div>

        </div>

        <div class="hud-panel">

            <div class="panel-header">
                <span>CORE_LOAD</span>
            </div>

            <div class="bar-chart">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        </div>

    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =====================================
   SCENE
===================================== */

const scene =
new THREE.Scene();

scene.fog =
new THREE.FogExp2(
    0x000000,
    0.015
);

const camera =
new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.1,

    2000
);

camera.position.z = 40;

const renderer =
new THREE.WebGLRenderer({

    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
.getElementById('webgl-container')
.appendChild(renderer.domElement);

/* =====================================
   POST FX
===================================== */

const composer =
new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom =
new UnrealBloomPass(

    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),

    1.7,
    0.5,
    0.2
);

composer.addPass(bloom);

/* =====================================
   SHADER CORE
===================================== */

const uniforms = {

    uTime:{value:0}
};

const coreMaterial =
new THREE.ShaderMaterial({

    transparent:true,

    wireframe:true,

    uniforms,

    vertexShader:`

    uniform float uTime;

    varying vec3 vNormal;

    void main(){

        vNormal = normal;

        vec3 pos = position;

        float wave =

        sin(pos.y * 3.0 + uTime * 1.5)
        *
        cos(pos.x * 3.0 + uTime)
        *
        0.5;

        pos += normal * wave;

        gl_Position =

        projectionMatrix *
        modelViewMatrix *
        vec4(pos,1.0);
    }
    `,

    fragmentShader:`

    varying vec3 vNormal;

    void main(){

        float fresnel =

        pow(
            1.0 -
            dot(vNormal,vec3(0,0,1.0)),
            3.0
        );

        vec3 gold =
        vec3(0.83,0.68,0.22);

        vec3 ember =
        vec3(1.0,0.3,0.0);

        vec3 color =

        gold * fresnel * 2.5
        +
        ember * pow(fresnel,4.0);

        gl_FragColor =
        vec4(color,0.85);
    }
    `
});

const core =
new THREE.Mesh(

    new THREE.TorusKnotGeometry(
        4,
        1,
        300,
        32
    ),

    coreMaterial
);

scene.add(core);

/* =====================================
   RUNE RINGS
===================================== */

function createRing(radius,color){

    const group =
    new THREE.Group();

    const ringGeo =
    new THREE.RingGeometry(
        radius,
        radius + 0.05,
        120
    );

    const ringMat =
    new THREE.MeshBasicMaterial({

        color,
        side:THREE.DoubleSide,
        transparent:true,
        opacity:0.25
    });

    const ring =
    new THREE.Mesh(
        ringGeo,
        ringMat
    );

    group.add(ring);

    for(let i=0;i<32;i++){

        const angle =
        (Math.PI*2/32)*i;

        const geo =
        new THREE.BoxGeometry(
            0.1,
            0.5,
            0.05
        );

        const mat =
        new THREE.MeshBasicMaterial({
            color
        });

        const rune =
        new THREE.Mesh(geo,mat);

        rune.position.x =
        Math.cos(angle)*radius;

        rune.position.y =
        Math.sin(angle)*radius;

        rune.rotation.z =
        angle;

        group.add(rune);
    }

    group.rotation.x =
    Math.PI/2;

    return group;
}

const rune1 =
createRing(9,0xd4af37);

const rune2 =
createRing(13,0xff2a2a);

const rune3 =
createRing(17,0xff6b00);

scene.add(rune1,rune2,rune3);

/* =====================================
   SAO TUNNEL
===================================== */

const tunnelGeo =
new THREE.BufferGeometry();

const tunnelCount = 12000;

const positions =
new Float32Array(
    tunnelCount * 3
);

for(let i=0;i<tunnelCount;i++){

    const r =
    10 + Math.random()*25;

    const theta =
    Math.random() * Math.PI * 2;

    positions[i*3] =
    Math.cos(theta)*r;

    positions[i*3+1] =
    Math.sin(theta)*r;

    positions[i*3+2] =
    (Math.random()-0.5)*800;
}

tunnelGeo.setAttribute(

    'position',

    new THREE.BufferAttribute(
        positions,
        3
    )
);

const tunnelMat =
new THREE.PointsMaterial({

    color:'#d4af37',

    size:0.12,

    transparent:true,

    opacity:0.9
});

const tunnel =
new THREE.Points(
    tunnelGeo,
    tunnelMat
);

scene.add(tunnel);

/* =====================================
   DATA
===================================== */

function syncData(){

    const now = new Date();

    document.getElementById('date')
    .innerText =
    now.toLocaleDateString();

    document.getElementById('time')
    .innerText =
    now.toLocaleTimeString();

    document.getElementById('utc')
    .innerText =
    now.toUTCString().slice(17,25);

    document.getElementById('platform')
    .innerText =
    navigator.platform;

    document.getElementById('cores')
    .innerText =
    navigator.hardwareConcurrency;

    document.getElementById('lang')
    .innerText =
    navigator.language;

    document.getElementById('width')
    .innerText =
    window.innerWidth;

    document.getElementById('height')
    .innerText =
    window.innerHeight;

    document.getElementById('ratio')
    .innerText =
    window.devicePixelRatio.toFixed(2);
}

syncData();

setInterval(syncData,1000);

/* =====================================
   ANIMATE
===================================== */

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const t =
    clock.getElapsedTime();

    uniforms.uTime.value = t;

    core.rotation.x += 0.002;
    core.rotation.y += 0.004;

    rune1.rotation.z += 0.002;
    rune2.rotation.z -= 0.0015;
    rune3.rotation.z += 0.001;

    const arr =
    tunnelGeo.attributes.position.array;

    for(let i=2;i<tunnelCount*3;i+=3){

        arr[i] += 4.5;

        if(arr[i] > 80){

            arr[i] = -700;
        }
    }

    tunnelGeo.attributes
    .position.needsUpdate = true;

    document
    .querySelectorAll('.bar')
    .forEach(bar=>{

        if(Math.random()>0.8){

            bar.style.height =
            (15 + Math.random()*85)
            + '%';
        }
    });

    composer.render();
}

animate();

/* =====================================
   BOOT
===================================== */

gsap.to(

    '.boot-title',

    {
        opacity:1,
        duration:2
    }
);

gsap.to(

    '.boot-screen',

    {
        opacity:0,
        delay:3,
        duration:2,

        onComplete:()=>{

            document
            .querySelector('.boot-screen')
            .style.display='none';
        }
    }
);

gsap.to(

    '.hud-panel',

    {
        opacity:1,

        y:0,

        from:{y:40},

        stagger:0.08,

        delay:3.2,

        duration:1.5,

        ease:'power4.out'
    }
);

/* =====================================
   BUTTON
===================================== */

document
.getElementById('engage-btn')
.addEventListener('click',()=>{

    gsap.fromTo(

        camera.position,

        {
            z:40
        },

        {
            z:22,

            duration:2,

            ease:'power3.inOut',

            yoyo:true,

            repeat:1
        }
    );

    gsap.to(

        core.scale,

        {
            x:1.4,
            y:1.4,
            z:1.4,

            duration:1.2,

            yoyo:true,

            repeat:1
        }
    );

    gsap.to(

        bloom,

        {
            strength:3,

            duration:0.6,

            yoyo:true,

            repeat:1
        }
    );
});

/* =====================================
   RESIZE
===================================== */

window.addEventListener(

    'resize',

    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
