<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAO Black Gold System Demo</title>
    <!-- 引入 GSAP 動畫庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --obsidian: #0D0D0D;
            --royal-gold: #D4AF37;
            --satin-gold: #B8860B;
            --amber-glow: #FFD700;
            --pearl-white: #E0E0E0;
            --gold-gradient: linear-gradient(45deg, #B8860B, #F9A602, #B8860B);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--obsidian);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--pearl-white);
        }

        /* 背景粒子裝飾 */
        .bg-dust {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* 觸發按鈕 */
        .trigger-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--royal-gold);
            background: transparent;
            border: 2px solid var(--royal-gold);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            z-index: 10;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .trigger-btn:hover {
            background: var(--royal-gold);
            color: var(--obsidian);
            box-shadow: 0 0 20px var(--royal-gold);
        }

        /* SAO 遮罩層 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: none;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        /* 金色爆發環 */
        .gold-ring {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--amber-glow);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        /* SAO 彈窗主體 */
        .sao-modal {
            position: relative;
            width: 500px;
            height: 350px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            z-index: 101;
        }

        /* L-Shape 角標 */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--royal-gold);
            z-index: 102;
        }
        .tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
        .tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; }
        .bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; }
        .br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

        /* 鎖定閃光 */
        .lock-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 103;
        }

        /* 內容文字 */
        .content {
            text-align: center;
            padding: 40px;
        }
        .title {
            font-size: 2rem;
            margin-bottom: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            opacity: 0;
        }
        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--pearl-white);
            opacity: 0;
        }

        .close-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--royal-gold);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            opacity: 0;
        }

    </style>
</head>
<body>

    <div class="bg-dust"></div>
    
    <button class="trigger-btn" onclick="openSAO()">激活系統接口</button>

    <!-- 彈窗構造 -->
    <div class="overlay" id="overlay">
        <div class="gold-ring" id="goldRing"></div>
        
        <div class="sao-modal" id="saoModal">
            <!-- 四個 L 型角標 -->
            <div class="corner tl" id="tl"></div>
            <div class="corner tr" id="tr"></div>
            <div class="corner bl" id="bl"></div>
            <div class="corner br" id="br"></div>
            
            <div class="lock-flash" id="lockFlash"></div>

            <div class="content">
                <div class="title" id="title">S.A.O SYSTEM ACTIVE</div>
                <div class="description" id="desc">
                    正在同步黑金數據庫...<br>
                    小說類別：頂級奢華-電影級<br>
                    狀態：完全鎖定 (Locked-on)
                </div>
            </div>
            <div class="close-btn" id="closeBtn" onclick="closeSAO()">[ 關閉連接 ]</div>
        </div>
    </div>

    <script>
        function openSAO() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';

            // 創建 GSAP 時間軸
            const tl = gsap.timeline();

            // 1. 激活：金色圓環爆發
            tl.to("#goldRing", {
                scale: 80,
                opacity: 1,
                duration: 0.4,
                ease: "expo.out"
            })
            .to("#goldRing", {
                opacity: 0,
                duration: 0.2
            }, "-=0.2");

            // 2. 構造：四個角標從外向內收縮
            tl.from(".corner", {
                x: (i) => (i % 2 === 0 ? -500 : 500),
                y: (i) => (i < 2 ? -500 : 500),
                opacity: 0,
                duration: 0.5,
                stagger: 0.05,
                ease: "power4.out"
            }, "-=0.3");

            // 3. 展開：主體彈出
            tl.to("#saoModal", {
                opacity: 1,
                scale: 1,
                duration: 0.6,
                ease: "back.out(1.7)"
            }, "-=0.2");

            // 4. 鎖定：強光閃爍
            tl.to("#lockFlash", {
                opacity: 0.3,
                duration: 0.1,
                repeat: 1,
                yoyo: true,
                ease: "power2.inOut"
            });

            // 5. 填充：文字流刷入
            tl.to("#title", {
                opacity: 1,
                y: 0,
                duration: 0.4,
                ease: "power2.out"
            }, "-=0.1");
            
            tl.to("#desc", {
                opacity: 1,
                duration: 0.5,
                ease: "power2.out"
            }, "-=0.2");

            tl.to("#closeBtn", {
                opacity: 1,
                duration: 0.3
            }, "-=0.2");
        }

        function closeSAO() {
            const tl = gsap.timeline();
            
            tl.to("#saoModal, #closeBtn, #title, #desc", {
                opacity: 0,
                scale: 0.8,
                duration: 0.3,
                ease: "power2.in"
            });
            
            tl.to(".corner", {
                opacity: 0,
                scale: 0,
                duration: 0.2,
                stagger: 0.05
            }, "-=0.2");
            
            tl.to("#overlay", {
                opacity: 0,
                duration: 0.4,
                onComplete: () => {
                    document.getElementById('overlay').style.display = 'none';
                    document.getElementById('overlay').style.opacity = 1;
                }
            });
        }
    </script>
</body>
</html>
