<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane-AI Forbidden Protocol Access</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Consolas', 'Monaco', monospace; user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 2s ease; }
        #hud-overlay.active { opacity: 1; }

        /* Login Button - Sacred Holographic Interface */
        #login-btn { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 220px; height: 60px; padding: 10px; border: 1px solid rgba(226, 183, 100, 0.4); background: rgba(0,0,0,0.8); color: #e2b764; font-size: 16px; letter-spacing: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; pointer-events: auto; text-shadow: 0 0 10px #e2b764, 0 0 20px #d37324; box-shadow: inset 0 0 20px rgba(211, 115, 36, 0.3), 0 0 30px rgba(226, 183, 100, 0.1); opacity: 0; transition: box-shadow 0.3s ease, border-color 0.3s ease; }
        #login-btn:hover { border-color: #e2b764; box-shadow: inset 0 0 30px rgba(211, 115, 36, 0.5), 0 0 50px rgba(226, 183, 100, 0.3); }
        #login-btn .glyphs { font-size: 10px; margin: 0 10px; color: #d37324; animation: glyph-pulse 1.5s infinite; }
        @keyframes glyph-pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* HUD Panels - High Density */
        .hud-panel { position: absolute; border: 1px solid rgba(211, 115, 36, 0.15); background: rgba(5,5,8,0.7); backdrop-filter: blur(5px); color: rgba(226, 183, 100, 0.7); overflow: hidden; font-size: 10px; line-height: 1.2; box-shadow: inset 0 0 15px rgba(211, 115, 36, 0.05); }
        .panel-header { font-size: 11px; font-weight: bold; color: #e2b764; border-bottom: 1px solid rgba(226, 183, 100, 0.3); padding: 4px 8px; letter-spacing: 2px; }
        .data-stream { padding: 6px 8px; white-space: pre; color: rgba(226, 183, 100, 0.5); }
        .status-warn { color: #ff2a2a; animation: alert-pulse 0.5s infinite; }
        @keyframes alert-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Panel Placements */
        #top-right { top: 3%; right: 2%; width: 300px; height: 350px; }
        #bottom-left { bottom: 3%; left: 2%; width: 280px; height: 300px; }
        #top-left-status { top: 3%; left: 2%; width: 200px; height: 180px; }
        #top-left-status .boot-line { color: #d37324; }
        #bottom-right-analysis { bottom: 3%; right: 2%; width: 350px; height: 250px; border-top-color: rgba(211, 115, 36, 0.4); }

        /* Procedural Charts */
        .waveform-canvas { position: absolute; bottom: 10px; left: 10px; width: calc(100% - 20px); height: 40px; }
        .radar-scan { position: relative; width: 100px; height: 100px; margin: 10px auto; border: 1px solid rgba(226, 183, 100, 0.3); border-radius: 50%; overflow: hidden; }
        .radar-scan::before { content:''; position:absolute; width:100%; height:2px; background: rgba(0,243,255,0.4); top:50%; animation: radar-sweep 2s linear infinite; }
        @keyframes radar-sweep { 0% { transform: translateY(-50px) rotate(0deg); } 100% { transform: translateY(50px) rotate(360deg); } }

        /* Custom Scrollbar for HUD */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(226, 183, 100, 0.3); }

        /* Dynamic Loading Text */
        #init-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--cyan); letter-spacing: 5px; font-size: 18px; text-shadow: 0 0 10px var(--cyan); z-index: 100; }
        #init-loader .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    
    <div id="init-loader">INIT_CORE_PROTOCOLS<span class="cursor">_</span></div>

    <div id="canvas-container"></div>

    <div id="hud-overlay">
        <button id="login-btn"><span class="glyphs">◢◢</span> SACRED ACTIVATION <span class="glyphs">◣◣</span></button>

        <div class="hud-panel wide" id="top-right">
            <div class="panel-header">SYS_CORE_MONITOR // THREAD_V4.8</div>
            <div class="data-stream" id="t1-stream"></div>
            <div class="data-grid">
                <div class="data-cell">CORE_SYNC <span class="val" id="sync-val">99.8%</span></div>
                <div class="data-cell">AI_LATENCY <span class="val val-warn">12ms</span></div>
            </div>
            <div class="chart-container"><canvas id="waveform-1" class="waveform-canvas"></canvas></div>
        </div>

        <div class="hud-panel" id="bottom-left">
            <div class="panel-header">NODE_MAP // SECTOR_GAMMA</div>
            <div class="radar-scan"></div>
            <div class="data-stream" id="t2-stream"></div>
        </div>

        <div class="hud-panel" id="top-left-status">
            <div class="panel-header">AI_MEM_DUMP</div>
            <div class="data-stream" id="boot-log"></div>
        </div>

        <div class="hud-panel" id="bottom-right-analysis">
            <div class="panel-header">ANALYSIS_ENV // FANTASY_PROTOCOL_ALPHA</div>
            <div class="data-stream" id="analysis-stream"></div>
            <canvas id="waveform-2" class="waveform-canvas"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/SAOPass.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/shaders/FilmShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/shaders/DigitalGlitchShader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <script>
        // Use ESM compatibility within script tags
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { SAOPass } from 'three/addons/postprocessing/SAOPass.js';
        import { FilmShader } from 'three/addons/shaders/FilmShader.js';

        const APP = {
            colors: { bg: 0x000000, gold: 0xe2b764, amber: 0xd37324, crimson: 0xff003c },
            meshes: { runeSystems: [] },
            glitchActive: false
        };

        // --- Core Setup & Post-Processing ---
        function initApp() {
            // Three.js Core
            APP.scene = new THREE.Scene();
            APP.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
            APP.renderer = new THREE.WebGLRenderer({ antialias: true });
            APP.renderer.setPixelRatio(window.devicePixelRatio);
            APP.renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(APP.renderer.domElement);

            APP.scene.fog = new THREE.FogExp2(0x0a0a0f, 0.0006); // Depth Atmosphere

            // Post-Processing - High Complexity VFX Chain
            APP.composer = new EffectComposer(APP.renderer);
            APP.composer.addPass(new RenderPass(APP.scene, APP.camera));

            // AAA Bloom (God Rays/Glow)
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.4, 0.8);
            APP.composer.addPass(bloomPass);

            // film Grain, Scanlines, Chromatic Aberration
            const filmPass = new ShaderPass(FilmShader);
            filmPass.uniforms['nIntensity'].value = 0.5; // Film Grain
            filmPass.uniforms['sIntensity'].value = 0.1; // Scanlines
            filmPass.uniforms['sCount'].value = 800;
            filmPass.uniforms['grayscale'].value = false;
            APP.composer.addPass(filmPass);
            APP.filmUniforms = filmPass.uniforms;

            // Ambient Occlusion
            const saoPass = new SAOPass(APP.scene, APP.camera);
            saoPass.params.output = SAOPass.OUTPUT.Default;
            saoPass.params.saoBias = 0.5;
            saoPass.params.saoIntensity = 0.01;
            APP.composer.addPass(saoPass);

            // Custom Lens Distortion / Vignette Shader (Procedural)
            const distortionShader = {
                uniforms: { tDiffuse: { value: null }, amount: { value: 0.1 } },
                vertexShader: `
                    varying vec2 vUv;
                    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float amount;
                    varying vec2 vUv;
                    void main() {
                        vec2 uv = vUv;
                        vec2 dist = uv - 0.5;
                        float d = length(dist);
                        uv += dist * d * d * amount; // Lens Distortion
                        vec4 color = texture2D(tDiffuse, uv);
                        float vignette = smoothstep(0.7, 0.4, d); // Vignette
                        gl_FragColor = color * vignette;
                        gl_FragColor.rgb *= 1.2; // slight boost for bloom pass
                    }
                `
            };
            const distortionPass = new ShaderPass(distortionShader);
            APP.composer.addPass(distortionPass);

            APP.camera.position.set(0, 50, 400);

            createLivingSystem();
            initHUD();
            animate();
            
            // Initial sequence hook
            runActivationRitual();
        }

        // --- Creating the "Dimensional Arcane Core" ---
        function createLivingSystem() {
            APP.systemGroup = new THREE.Group();
            APP.scene.add(APP.systemGroup);

            // 1. Central Core: Dimensional Arcane Seal Core (Non-Simple Geometry)
            const knotGeom = new THREE.TorusKnotGeometry(45, 12, 200, 32, 2, 3);
            knotGeom.computeVertexNormals();

            // ShaderMaterial for Molten Gold Energy
            const coreMat = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 }, color: { value: new THREE.Color(APP.colors.crimson) } },
                vertexShader: `
                    varying vec3 vNormal; varying vec3 vPosition;
                    void main() { vNormal = normalize(normalMatrix * normal); vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
                `,
                fragmentShader: `
                    uniform float time; uniform vec3 color; varying vec3 vNormal; varying vec3 vPosition;
                    void main() {
                        float intensity = 1.0 + 0.3 * sin(time * 3.0 + length(vPosition) * 0.05);
                        float glow = pow(0.7 - dot(vNormal, vec3(0,0,1.0)), 3.0);
                        vec3 finalColor = color + vec3(1.0, 0.7, 0.0) * glow * intensity;
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `,
                wireframe: true, transparent: true, blending: THREE.AdditiveBlending
            });
            APP.meshes.coreknot = new THREE.Mesh(knotGeom, coreMat);
            APP.systemGroup.add(APP.meshes.coreknot);
            APP.coreMat = coreMat;

            // Add inner pulsing sphere (sacred geometry)
            const innerGeom = new THREE.IcosahedronGeometry(25, 4);
            const innerMat = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 }, color: { value: new THREE.Color(APP.colors.amber) } },
                vertexShader: `
                    varying vec3 vNormal; void main() { vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
                `,
                fragmentShader: `
                    uniform float time; uniform vec3 color; varying vec3 vNormal;
                    void main() { float glow = pow(0.6 - dot(normalize(vNormal), vec3(0,0,1.0)), 2.0);
                    gl_FragColor = vec4(color * (1.0 + 0.5 * sin(time * 6.0)) + vec3(1,0,0) * glow * 2.0, 0.8); }
                `, wireframe: true, transparent: true, blending: THREE.AdditiveBlending
            });
            APP.systemGroup.add(new THREE.Mesh(innerGeom, innerMat));
            APP.innerMat = innerMat;


            // Floating metallic fragments
            createInstancedFragments();

            // 2. Over 20 Layered Rune Systems (Procedural linework)
            createRuneSystems();

            // 3. Volumetric Particle System (Ember particles attracted to core)
            createGPUParticles();
        }

        // Procedural generation of dense fragment field
        function createInstancedFragments() {
            const geom = new THREE.TetrahedronGeometry(1.5, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x302010, emissive: APP.colors.amber, emissiveIntensity: 0.1, roughness: 0.2, metalness: 0.9, transparent: true, blending: THREE.AdditiveBlending
            });
            const mesh = new THREE.InstancedMesh(geom, mat, 4000);
            APP.meshes.fragments = mesh;
            APP.systemGroup.add(mesh);

            const matrix = new THREE.Matrix4();
            const position = new THREE.Vector3();
            const rotation = new THREE.Euler();
            const scale = new THREE.Vector3();

            for (let i = 0; i < 4000; i++) {
                // Spherical distribution with density near center
                const radius = 100 + 400 * Math.pow(Math.random(), 3);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                position.set(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
                rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                
                scale.setScalar(0.5 + Math.random() * 2);
                
                matrix.compose(position, new THREE.Quaternion().setFromEuler(rotation), scale);
                mesh.setMatrixAt(i, matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
        }

        // Generate 20+ layers of independently rotating procedural linework
        function createRuneSystems() {
            const count = 28; // > 20 as requested
            for (let i = 0; i < count; i++) {
                const geom = new THREE.RingGeometry(80 + i * 8, 81 + i * 8, 128);
                const mat = new THREE.ShaderMaterial({
                    uniforms: { time: { value: 0 }, color: { value: new THREE.Color(i % 3 === 0 ? APP.colors.gold : APP.colors.amber) }, seed: { value: Math.random() } },
                    vertexShader: `
                        varying vec2 vUv; varying float vDist;
                        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
                    `,
                    fragmentShader: `
                        uniform float time; uniform float seed; uniform vec3 color; varying vec2 vUv;
                        void main() {
                            // High-density procedural linework simulation
                            float linemask = abs(sin(vUv.x * 200.0 * seed + time * 0.5));
                            if(linemask < 0.96) discard;

                            // Micro symbols simulation
                            float glyph = abs(sin(vUv.x * 1000.0 * seed * seed + time * (1.0 + seed)));
                            float alpha = smoothstep(0.8, 1.0, glyph);

                            // Scanning lines
                            float scan = sin(vUv.x * 50.0 + time * 10.0) * 0.5 + 0.5;
                            vec3 finalColor = color + vec3(1,0.5,0) * scan * 0.3;

                            gl_FragColor = vec4(finalColor, (0.4 + alpha * 0.6) * 0.8);
                        }
                    `, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.z = Math.sin(i * 0.5) * 5;
                mesh.rotation.x = Math.PI / 2 + Math.random() * 0.05;
                
                // Independant rotation (clock vs counter)
                APP.meshes.runeSystems.push({ mesh: mesh, speed: (Math.random() - 0.5) * 0.15, mat: mat });
                APP.systemGroup.add(mesh);
            }
        }

        // Particle VFX - Embder/Gold sparkles attracted to core
        function createGPUParticles() {
            const count = 30000;
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const seeds = new Float32Array(count * 2);

            for (let i = 0; i < count * 3; i += 3) {
                const radius = 200 + Math.random() * 1000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                positions[i] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = radius * Math.cos(phi);
                positions[i + 2] = radius * Math.sin(phi) * Math.sin(theta);

                // Speed and drift randomness
                seeds[i/3 * 2] = 0.1 + Math.random() * 0.5; // velocity factor
                seeds[i/3 * 2 + 1] = Math.random(); // offset factor
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 2));

            const mat = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 }, color: { value: new THREE.Color(APP.colors.amber) } },
                vertexShader: `
                    uniform float time; uniform vec3 color; varying vec3 vColor; varying float vLife;
                    attribute vec2 seed;
                    void main() {
                        vec3 pos = position;
                        float vel = seed.x; float offset = seed.y;
                        vLife = mod(time * vel * 0.2 + offset, 1.0); // 0.0 to 1.0 cycle

                        // Move towards center
                        pos *= (1.0 - vLife * vLife);
                        
                        // Apply slight random drift
                        pos.x += sin(time * offset + offset) * offset * 20.0;
                        pos.y += cos(time * offset + offset) * offset * 20.0;

                        // Fade in, hold, fade out
                        vColor = color + vec3(1,1,0.5) * (smoothstep(0.0, 0.1, vLife) * smoothstep(1.0, 0.9, vLife));

                        gl_PointSize = (1.5 + offset * 3.0) * smoothstep(0.0, 0.1, vLife) * (1.0 - vLife);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor; varying float vLife;
                    void main() { float d = length(gl_PointCoord - 0.5);
                    if(d > 0.5) discard;
                    gl_FragColor = vec4(vColor * vLife, 1.0 - d * 2.0); }
                `, transparent: true, blending: THREE.AdditiveBlending
            });
            APP.meshes.particles = new THREE.Points(geom, mat);
            APP.systemGroup.add(APP.meshes.particles);
            APP.particleMat = mat;
        }

        // --- HUD Logic - High Information Density ---
        function initHUD() {
            initProceduralCharts();
            initDataStreams();
            
            // SACRED ACTIVATION button interaction
            const btn = document.getElementById('login-btn');
            btn.addEventListener('mouseenter', handleLoginHover);
            btn.addEventListener('click', handleLogin);
        }

        function initProceduralCharts() {
            APP.hudCanvases = {
                w1: document.getElementById('waveform-1'),
                w2: document.getElementById('waveform-2')
            };
            APP.hudContexts = {
                w1: APP.hudCanvases.w1.getContext('2d'),
                w2: APP.hudCanvases.w2.getContext('2d')
            };
            // Set internal resolution low for pixelated procedural look
            APP.hudCanvases.w1.width = 300; APP.hudCanvases.w1.height = 40;
            APP.hudCanvases.w2.width = 350; APP.hudCanvases.w2.height = 40;
        }

        // Procedural charts: Dynamic waveforms, live graphs
        function updateCharts(time) {
            drawWaveform(APP.hudContexts.w1, 300, 40, time, APP.colors.cyan);
            drawWaveform(APP.hudContexts.w2, 350, 40, time * 1.5, APP.colors.gold);
        }

        function drawWaveform(ctx, w, h, time, baseColor) {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = `rgba(${parseInt(baseColor.slice(2,4),16)}, ${parseInt(baseColor.slice(4,6),16)}, ${parseInt(baseColor.slice(6,8),16)}, 0.6)`;
            ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, h/2);
            for(let x=0; x<w; x++) { ctx.lineTo(x, h/2 + Math.sin(x*0.05 + time*5.0) * h/2.5 * Math.sin(x*0.01)); }
            ctx.stroke();
            // Dense micro dots
            ctx.fillStyle = ctx.strokeStyle;
            for(let x=0; x<w; x+=10) { const y = h/2 + Math.sin(x*0.05 + time*5.0) * h/2.5 * Math.sin(x*0.01); ctx.fillRect(x, y, 1, 1); }
        }

        // Procedural Information Streams: Encrypted text flow, tactical data
        function initDataStreams() {
            APP.streams = {
                t1: { target: document.getElementById('t1-stream'), content: "", source: [..."INIT_NEURAL_LINK THREAD // [47%] // OK // CHK_PANTHEON // ERR_FORBIDDEN"] },
                t2: { target: document.getElementById('t2-stream'), content: "", source: [..."ACTIVE SECTOR matrix // RUNE_ID [", ..."GAMMA48", ..."] // MAP_SYMBOLS // flow_12//[ACT]"] },
                analysis: { target: document.getElementById('analysis-stream'), content: "", source: [..."CRYPT_ANALYSIS proto_v4.2 // dimension_core = geometry. sacred // fragment_drift. molten_gold // distortion // living_system"] },
                boot: { target: document.getElementById('boot-log'), content: "", source: [..."// nerveGear OS v2.1 // sense sync: OK // AI module: ACTIVE // fullDive matrix // [LOADING...]"] }
            };
            // Initial data populate
            for(let key in APP.streams) { APP.streams[key].target.innerHTML = APP.streams[key].source.slice(0, 100).join(''); }
        }

        // The interface feels like a living AI thinking in real time.
        function updateDataStreams() {
            // High frequency updates: live text updates, scanning animations, particle drift
            for(let key in APP.streams) {
                if(Math.random() > 0.3) { // random chance to change one character for 'active thinking' feel
                    const char = String.fromCharCode(Math.random()>0.8 ? 33 + Math.random()*15 : 65 + Math.random()*26);
                    let content = APP.streams[key].target.innerHTML;
                    if(content.length < 2000) { content = (char + content).slice(0, 500); // Shift text
                    } else { content = (content + char).slice(-500); // Flow text
                    }
                    APP.streams[key].target.innerHTML = content;
                }
            }
        }

        // --- Camera & Immersive Logic ---
        function animateCamera(time) {
            // Cinematic camera movement: slow push-ins, subtle drift, orbital movement, depth atmosphere
            const pushInFactor = 1.0 - Math.pow(Math.random(), 0.1) * 0.001;
            APP.camera.position.z *= pushInFactor; 
            APP.camera.position.x = 20 * Math.sin(time * 0.1); 
            APP.camera.position.y = 50 + 10 * Math.cos(time * 0.2);
            APP.camera.lookAt(0, 50, 0);
        }

        // --- Sequence Logic: Sacred Activation Ritual ---
        function runActivationRitual() {
            gsap.set('#canvas-container', { opacity: 0 }); // Screen begins nearly black

            const tl = gsap.timeline({ onComplete: () => {
                document.getElementById('init-loader').style.display = 'none';
                initHUD(); // All HUD element are now dynamic
            }});

            tl.to('#canvas-container', { opacity: 1, duration: 4, ease: "power2.inOut" }, "+=1");
            tl.to(APP.camera.position, { z: 400, duration: 8, ease: "power2.out" }, "-=3"); // Slow push-in starts nearly black
            
            tl.to('#login-btn', { opacity: 1, duration: 2, y: "-=20", ease: "back.out(2)" }, "-=2");
            tl.to('#hud-overlay', { className: 'hud-overlay active', duration: 1 }, "-=1");
            
            tl.play();
        }

        // The interface reacts Dynamically to hover (nearby glyphs react dynamically)
